<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Fan specials / 粉丝特殊牌</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">One variant 一次一种</text>
    <text x="130.7" y="120" fill="#5D4037">Add only one</text>
    <text x="130.7" y="148" fill="#8D6E63">每次只加一种</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Even/Odd row 奇偶行</text>
    <text x="360.0" y="120" fill="#5D4037">Row takes even/odd</text>
    <text x="360.0" y="148" fill="#8D6E63">该行只收奇或偶</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Other twists 其他变体</text>
    <text x="589.3" y="120" fill="#5D4037">Jump, flip, climb</text>
    <text x="589.3" y="148" fill="#8D6E63">跳牛、翻数、爬山</text>
  </g>
</svg>
