<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
<rect width="720" height="260" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">n² plus 7 per set / 平方再加套装</text>
<circle cx="70" cy="90" r="16" fill="#fff" stroke="#5D4037" stroke-width="2"/><circle cx="70" cy="90" r="5" fill="#5D4037"/><circle cx="110" cy="90" r="16" fill="#fff" stroke="#5D4037" stroke-width="2"/><circle cx="110" cy="90" r="5" fill="#5D4037"/><circle cx="150" cy="90" r="16" fill="#fff" stroke="#5D4037" stroke-width="2"/><circle cx="150" cy="90" r="5" fill="#5D4037"/><text x="110" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">3 个同符号 → 9</text><circle cx="280" cy="90" r="16" fill="#fff" stroke="#5D4037" stroke-width="2"/><circle cx="280" cy="90" r="5" fill="#5D4037"/><rect x="314" y="74" width="32" height="32" rx="4" fill="#fff" stroke="#C4952A" stroke-width="2"/><polygon points="380,74 396,106 364,106" fill="#fff" stroke="#00897B" stroke-width="2"/><text x="330" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">一套三种 +7</text><text x="560" y="90" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#5D4037">9 + 7 = 16</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">相同科学符号按个数平方；每凑齐齿轮/石板/罗盘一套再 +7</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Identical symbols score n²; each complete set of three types is +7</text>
</svg>
