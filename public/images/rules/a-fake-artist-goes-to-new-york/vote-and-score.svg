<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240"><rect width="720" height="240" rx="18" fill="#FAFAF5"/><text x="360" y="32" text-anchor="middle" font-family="Georgia" font-size="22" fill="#5D4037">Vote together, then resolve the fake's guess</text><g font-family="Arial" text-anchor="middle"><circle cx="145" cy="115" r="36" fill="#D81B60"/><text x="145" y="122" font-size="18" fill="white">?</text><path d="M230 115H310" stroke="#C4952A" stroke-width="4"/><text x="360" y="108" font-size="16" fill="#5D4037">most votes?</text><text x="360" y="133" font-size="14" fill="#8D6E63">one title guess</text><path d="M410 115H490" stroke="#C4952A" stroke-width="4"/><text x="560" y="108" font-size="16" fill="#5D4037">score</text><text x="560" y="135" font-size="14" fill="#8D6E63">fake + QM: 2</text><text x="560" y="157" font-size="14" fill="#8D6E63">or artists: 1 each</text></g><text x="360" y="218" text-anchor="middle" font-family="Arial" font-size="15" fill="#5D4037">A tied top vote lets the fake escape.</text></svg>
