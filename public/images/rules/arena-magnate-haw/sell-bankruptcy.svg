<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
<rect width="720" height="260" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Sell at half, or go bust / 半价卖掉，否则破产</text>
<rect x="60" y="55" width="80" height="80" rx="8" fill="#fff" stroke="#5D4037"/><text x="100" y="95" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">资产</text><path d="M160 95 L210 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="250" cy="90" r="16" fill="#F9A825" stroke="#5D4037" stroke-width="1.2"/><text x="250" y="94" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="11" font-weight="700" fill="#5D4037">½</text><text x="250" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">半价或拍卖</text><rect x="400" y="55" width="240" height="90" rx="12" fill="#fff" stroke="#C62828" stroke-width="2"/><text x="520" y="90" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">没有资产 + 还欠债</text><text x="520" y="114" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">破产出局</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">资产可半价卖出或拍卖；若已无资产却仍欠债，即破产</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Sell at 50% or auction; no assets plus debt is bankruptcy</text>
</svg>
