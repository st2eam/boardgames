<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Marine Worlds alternative action cards</title><desc id="desc">Choose one consistent personal alternative set before the game; action strength still cycles from one to five.</desc>
  <rect width="720" height="260" rx="18" fill="#FAFAF5"/>
  <text x="360" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#5D4037">Choose one consistent alternative action set</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#5D4037" stroke-width="2"><rect x="78" y="78" width="102" height="125" rx="12"/><rect x="194" y="78" width="102" height="125" rx="12"/><rect x="310" y="78" width="102" height="125" rx="12"/><rect x="426" y="78" width="102" height="125" rx="12"/><rect x="542" y="78" width="102" height="125" rx="12"/></g><g font-size="15" font-weight="700" fill="#5D4037"><text x="129" y="115">Cards</text><text x="245" y="115">Build</text><text x="361" y="115">Animals</text><text x="477" y="115">Association</text><text x="593" y="115">Sponsors</text></g><g font-size="12" fill="#8D6E63"><text x="129" y="143">alternative</text><text x="245" y="143">alternative</text><text x="361" y="143">alternative</text><text x="477" y="143">alternative</text><text x="593" y="143">alternative</text></g><g fill="#C4952A" font-size="20" font-weight="700"><text x="129" y="181">1–5</text><text x="245" y="181">1–5</text><text x="361" y="181">1–5</text><text x="477" y="181">1–5</text><text x="593" y="181">1–5</text></g></g>
  <text x="360" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5D4037">The alternative wording changes an action, not the base game's choose–resolve–shift rhythm.</text>
</svg>
