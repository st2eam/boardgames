<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><rect width="720" height="300" rx="18" fill="#FAFAF5"/><style>text{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#5D4037}.title{font-family:Georgia,'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;font-size:23px;font-weight:700}.label{font-size:16px;font-weight:700}.body{font-size:14px;fill:#8D6E63}.small{font-size:12px;fill:#8D6E63}.box{fill:#fff;stroke:#5D4037;stroke-width:2}.gold{fill:#C4952A}.green{fill:#DCE8C5;stroke:#5D4037;stroke-width:2}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C4952A"/></marker></defs>
<text x="360" y="34" text-anchor="middle" class="title">行动卡循环：选卡 → 结算 → 回到 1</text>
<g text-anchor="middle"><rect x="55" y="82" width="92" height="76" rx="12" class="gold"/><rect x="177" y="82" width="92" height="76" rx="12" class="box"/><rect x="299" y="82" width="92" height="76" rx="12" class="box"/><rect x="421" y="82" width="92" height="76" rx="12" class="box"/><rect x="543" y="82" width="92" height="76" rx="12" class="box"/><text x="101" y="115" font-size="28" font-weight="700" fill="#fff">1</text><text x="101" y="142" font-size="13" fill="#fff">本次使用</text><text x="223" y="115" font-size="28" font-weight="700">2</text><text x="345" y="115" font-size="28" font-weight="700">3</text><text x="467" y="115" font-size="28" font-weight="700">4</text><text x="589" y="115" font-size="28" font-weight="700">5</text><text x="589" y="142" class="small">最强</text></g><path d="M590 175 C590 225 101 225 101 175" fill="none" stroke="#C4952A" stroke-width="4" marker-end="url(#arrow)"/><text x="360" y="266" text-anchor="middle" class="body">所选卡左侧的卡依次右移；已用卡放到强度 1。</text></svg>
