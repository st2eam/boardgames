<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Ark Nova action-card cycle</title><desc id="desc">Use the card at its strength, then shift it back to strength one.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C4952A"/></marker></defs>
  <rect width="720" height="260" rx="18" fill="#FAFAF5"/>
  <text x="360" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#5D4037">Action strength: choose → resolve → return to 1</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g fill="#fff" stroke="#5D4037" stroke-width="2"><rect x="55" y="88" width="92" height="74" rx="12"/><rect x="177" y="88" width="92" height="74" rx="12"/><rect x="299" y="88" width="92" height="74" rx="12"/><rect x="421" y="88" width="92" height="74" rx="12"/><rect x="543" y="88" width="92" height="74" rx="12"/></g>
    <g font-size="25" font-weight="700" fill="#5D4037"><text x="101" y="120">1</text><text x="223" y="120">2</text><text x="345" y="120">3</text><text x="467" y="120">4</text><text x="589" y="120">5</text></g>
    <g font-size="13" fill="#8D6E63"><text x="101" y="146">used card</text><text x="223" y="146">wait</text><text x="345" y="146">wait</text><text x="467" y="146">wait</text><text x="589" y="146">strongest</text></g>
  </g>
  <path d="M590 174 C590 218 101 218 101 174" fill="none" stroke="#C4952A" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="360" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5D4037">After resolving a card, shift the cards left of it right; the used card goes to 1.</text>
</svg>
