<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><rect width="720" height="300" rx="18" fill="#FAFAF5"/><style>text{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#5D4037}.title{font-family:Georgia,'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;font-size:23px;font-weight:700}.label{font-size:16px;font-weight:700}.body{font-size:14px;fill:#8D6E63}.small{font-size:12px;fill:#8D6E63}.box{fill:#fff;stroke:#5D4037;stroke-width:2}.gold{fill:#C4952A}.green{fill:#DCE8C5;stroke:#5D4037;stroke-width:2}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C4952A"/></marker></defs>
<text x="360" y="34" text-anchor="middle" class="title">安置动物：先有兽栏，再打动物</text><g text-anchor="middle"><rect x="45" y="76" width="180" height="112" rx="14" class="box"/><text x="135" y="108" class="label">1. 空兽栏</text><rect x="80" y="124" width="110" height="38" rx="7" class="green"/><text x="135" y="149" class="small">大小与地形合格</text><path d="M242 132 L322 132" stroke="#C4952A" stroke-width="4" marker-end="url(#arrow)"/><rect x="340" y="76" width="180" height="112" rx="14" class="box"/><text x="430" y="108" class="label">2. 检查条件</text><text x="430" y="138" class="body">费用 · 声望 · 图标</text><text x="430" y="162" class="body">合作动物园 · 卡牌前提</text><path d="M537 132 L610 132" stroke="#C4952A" stroke-width="4" marker-end="url(#arrow)"/><circle cx="650" cy="132" r="42" class="green"/><text x="650" y="128" font-size="24">动物</text><text x="650" y="153" class="small">打出并结算</text></g><text x="360" y="256" text-anchor="middle" class="body">满足所有印刷条件后，动物才可占用对应的空兽栏。</text></svg>
