<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img"><rect width="720" height="300" rx="18" fill="#FAFAF5"/><style>text{font-family:'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;fill:#5D4037}.title{font-family:Georgia,'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;font-size:23px;font-weight:700}.label{font-size:16px;font-weight:700}.body{font-size:14px;fill:#8D6E63}.small{font-size:12px;fill:#8D6E63}.box{fill:#fff;stroke:#5D4037;stroke-width:2}.gold{fill:#C4952A}.green{fill:#DCE8C5;stroke:#5D4037;stroke-width:2}</style><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C4952A"/></marker></defs>
<text x="360" y="34" text-anchor="middle" class="title">支持保育项目：派人 → 满足条件 → 推进保育</text><g text-anchor="middle"><rect x="38" y="78" width="180" height="108" rx="14" class="box"/><circle cx="82" cy="131" r="22" class="gold"/><text x="82" y="138" font-size="18" fill="#fff">人</text><text x="150" y="122" class="label">协会行动</text><text x="150" y="151" class="body">派可用工作者</text><path d="M235 132 L310 132" stroke="#C4952A" stroke-width="4" marker-end="url(#arrow)"/><rect x="328" y="78" width="174" height="108" rx="14" class="box"/><text x="415" y="119" class="label">项目条件</text><text x="415" y="151" class="body">选一个你满足的格</text><path d="M519 132 L585 132" stroke="#C4952A" stroke-width="4" marker-end="url(#arrow)"/><rect x="600" y="78" width="85" height="108" rx="14" class="green"/><text x="642" y="119" class="label">保育</text><text x="642" y="151" font-size="28">↑</text></g><text x="360" y="256" text-anchor="middle" class="body">把地图左侧 1 枚圆片放到条件上，获得项目与地图奖励。</text></svg>
