<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Ark Nova conservation project</title><desc id="desc">An association worker and matching animal icons support a conservation project.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#C4952A"/></marker></defs>
  <rect width="720" height="260" rx="18" fill="#FAFAF5"/>
  <text x="360" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#5D4037">Support a conservation project</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="58" y="78" width="178" height="105" rx="14" fill="#fff" stroke="#5D4037" stroke-width="2"/><circle cx="104" cy="128" r="20" fill="#C4952A"/><text x="104" y="135" font-size="18" fill="#fff">W</text><text x="160" y="116" font-size="15" font-weight="700" fill="#5D4037">Association</text><text x="160" y="143" font-size="14" fill="#8D6E63">place a worker</text>
  <path d="M256 130 L330 130" stroke="#C4952A" stroke-width="4" marker-end="url(#arrow)"/><rect x="348" y="78" width="130" height="105" rx="14" fill="#fff" stroke="#5D4037" stroke-width="2"/><text x="413" y="113" font-size="17" font-weight="700" fill="#5D4037">Match icons</text><text x="413" y="146" font-size="25">🐾  🌍</text>
  <path d="M496 130 L564 130" stroke="#C4952A" stroke-width="4" marker-end="url(#arrow)"/><rect x="580" y="78" width="102" height="105" rx="14" fill="#DCE8C5" stroke="#5D4037" stroke-width="2"/><text x="631" y="113" font-size="15" font-weight="700" fill="#5D4037">Advance</text><text x="631" y="142" font-size="14" fill="#5D4037">Conservation</text><text x="631" y="164" font-size="20">↑</text></g>
  <text x="360" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5D4037">Meet the printed project requirement, then take the revealed zoo-board bonus.</text>
</svg>
