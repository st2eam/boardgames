<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
<rect width="720" height="260" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Card values / 牌面点数</text>
<g><rect x="70" y="50" width="56" height="80" rx="8" fill="#fff" stroke="#5D4037" stroke-width="1.6"/><text x="78" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#5D4037">7</text><rect x="78" y="116" width="40" height="7" rx="2" fill="#5D4037"/></g><text x="98" y="148" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">2–10 面值</text><g><rect x="220" y="50" width="56" height="80" rx="8" fill="#fff" stroke="#5D4037" stroke-width="1.6"/><text x="228" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#5D4037">K</text><rect x="228" y="116" width="40" height="7" rx="2" fill="#5D4037"/></g><text x="248" y="148" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">人头 = 10</text><g><rect x="370" y="50" width="56" height="80" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="378" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C4952A">A</text><rect x="378" y="116" width="40" height="7" rx="2" fill="#C4952A"/></g><text x="398" y="148" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">A = 1 或 11</text><g><rect x="520" y="50" width="56" height="80" rx="8" fill="#fff" stroke="#C4952A" stroke-width="1.6"/><text x="528" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C4952A">A</text><rect x="528" y="116" width="40" height="7" rx="2" fill="#C4952A"/></g><g><rect x="590" y="60" width="56" height="80" rx="8" fill="#fff" stroke="#1565C0" stroke-width="1.6"/><text x="598" y="82" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1565C0">6</text><rect x="598" y="126" width="40" height="7" rx="2" fill="#1565C0"/></g><text x="580" y="158" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">软 17</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">2–10 按点数，J/Q/K 算 10，A 可当 1 或 11</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">2–10 face value, faces are 10, Ace is 1 or 11</text>
