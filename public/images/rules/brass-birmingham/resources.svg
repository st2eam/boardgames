<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
<rect width="720" height="300" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Coal needs a path · iron does not / 煤要通路，铁不用</text>
<circle cx="90" cy="90" r="28" fill="#fff" stroke="#C4952A" stroke-width="2.5"/><text x="90" y="94" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">矿</text><rect x="82" y="100" width="14" height="14" rx="3" fill="#5D4037" stroke="#5D4037" stroke-width="1"/><line x1="118" y1="90" x2="200" y2="90" stroke="#C4952A" stroke-width="6"/><circle cx="230" cy="90" r="28" fill="#fff" stroke="#5D4037"/><text x="230" y="94" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">你</text><text x="160" y="145" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">煤：沿连接拿</text><rect x="340" y="62" width="50" height="50" rx="8" fill="#fff" stroke="#5D4037"/><rect x="357" y="78" width="16" height="16" rx="3" fill="#90A4AE" stroke="#5D4037" stroke-width="1"/><text x="365" y="130" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">铁厂</text><text x="500" y="90" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">铁：地图上任意拿</text><text x="500" y="110" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">不必连通</text><rect x="80" y="175" width="44" height="44" rx="8" fill="#FFE082" stroke="#5D4037"/><text x="102" y="235" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">自己酒厂不用连通</text><rect x="280" y="175" width="44" height="44" rx="8" fill="#FFE082" stroke="#8D6E63"/><line x1="324" y1="197" x2="400" y2="197" stroke="#90A4AE" stroke-width="5" stroke-dasharray="6 4"/><text x="400" y="235" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">对手酒厂必须连通</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">煤必须沿连接走到煤矿；铁在任意铁厂拿；自己的酒不用连通，对手的要</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Coal needs a connection; iron does not; beer depends on whose brewery</text>
</svg>
