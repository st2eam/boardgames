<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">CABO! then one last turn / 喊完每人再动一次</text>
<text x="120" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="22" font-weight="700" fill="#C4952A">CABO!</text><text x="120" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">你喊停</text><path d="M200 95 L260 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><g><rect x="280" y="55" width="44" height="64" rx="8" fill="#fff" stroke="#5D4037" stroke-width="1.6"/><text x="288" y="77" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#5D4037">1</text><rect x="288" y="105" width="28" height="7" rx="2" fill="#5D4037"/></g><g><rect x="330" y="55" width="44" height="64" rx="8" fill="#fff" stroke="#5D4037" stroke-width="1.6"/><text x="338" y="77" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#5D4037">2</text><rect x="338" y="105" width="28" height="7" rx="2" fill="#5D4037"/></g><g><rect x="380" y="55" width="44" height="64" rx="8" fill="#fff" stroke="#5D4037" stroke-width="1.6"/><text x="388" y="77" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#5D4037">3</text><rect x="388" y="105" width="28" height="7" rx="2" fill="#5D4037"/></g><text x="355" y="140" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">其他人再行动一次</text><path d="M440 95 L500 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><g><rect x="520" y="50" width="48" height="70" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="528" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1565C0">3</text><rect x="528" y="106" width="32" height="7" rx="2" fill="#1565C0"/></g><g><rect x="575" y="50" width="48" height="70" rx="8" fill="#fff" stroke="#C62828" stroke-width="1.6"/><text x="583" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C62828">5</text><rect x="583" y="106" width="32" height="7" rx="2" fill="#C62828"/></g><text x="568" y="140" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">翻开加总</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">喊 CABO 后其他人各再行动一次，然后所有人翻开比点数和</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">After CABO, others take one last turn, then reveal and sum</text>
