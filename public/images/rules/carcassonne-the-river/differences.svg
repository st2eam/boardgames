<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">No U-turns; river splits fields / 禁止掉头，河分田</text>
<rect x="80" y="50" width="80" height="80" rx="6" fill="#C8E6C9" stroke="#5D4037" stroke-width="1.5"/><path d="M90 90 H150" stroke="#1565C0" stroke-width="10"/><rect x="160" y="50" width="80" height="80" rx="6" fill="#C8E6C9" stroke="#5D4037" stroke-width="1.5"/><path d="M170 90 H210 Q230 90 230 70" stroke="#1565C0" stroke-width="10" fill="none"/><text x="160" y="150" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">不能把河折回</text><rect x="400" y="50" width="90" height="90" rx="6" fill="#A5D6A7" stroke="#5D4037" stroke-width="1.5"/><path d="M410 95 H480" stroke="#1565C0" stroke-width="10"/><circle cx="430" cy="68" r="4.619999999999999" fill="#C4952A" stroke="#5D4037" stroke-width="1"/><path d="M421.6 86.2 Q430 72.2 438.4 86.2 Z" fill="#C4952A" stroke="#5D4037" stroke-width="1"/><circle cx="470" cy="68" r="4.619999999999999" fill="#5D4037" stroke="#5D4037" stroke-width="1"/><path d="M461.6 86.2 Q470 72.2 478.4 86.2 Z" fill="#5D4037" stroke="#5D4037" stroke-width="1"/><text x="445" y="160" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">河把田野切开</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">12 张河牌先放完；河不能掉头；河会把两边的田野分开</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Place all 12 river tiles first; no U-turns; the river also splits fields</text>
