<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">River instead of start tile / 河流取代起始板块</text>
<rect x="60" y="55" width="70" height="70" rx="6" fill="#BBDEFB" stroke="#5D4037" stroke-width="1.5"/><path d="M70 90 Q95 70 120 90" fill="none" stroke="#1565C0" stroke-width="8"/><text x="95" y="145" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">源头先放</text><rect x="180" y="70" width="36" height="36" rx="6" fill="#E3F2FD" stroke="#5D4037" stroke-width="1.5"/><rect x="222" y="70" width="36" height="36" rx="6" fill="#E3F2FD" stroke="#5D4037" stroke-width="1.5"/><rect x="264" y="70" width="36" height="36" rx="6" fill="#E3F2FD" stroke="#5D4037" stroke-width="1.5"/><rect x="306" y="70" width="36" height="36" rx="6" fill="#E3F2FD" stroke="#5D4037" stroke-width="1.5"/><text x="264" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">洗河牌</text><rect x="480" y="55" width="70" height="70" rx="6" fill="#1565C0" stroke="#5D4037" stroke-width="1.5"/><ellipse cx="515" cy="90" rx="18" ry="12" fill="#0D47A1"/><text x="515" y="145" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">湖泊压在牌堆底</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">收起原起始板块；先放源头，洗其余河牌，湖泊放在牌堆最下面</text>
