<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Wall, Monuments, VP / 长城、古迹与胜利点</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Great Wall 长城</text>
    <text x="130.7" y="120" fill="#5D4037">Build sections → Builder card</text>
    <text x="130.7" y="148" fill="#8D6E63">建城墙段得建筑师卡</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Monuments 古迹</text>
    <text x="360.0" y="120" fill="#5D4037">First to connect claims it</text>
    <text x="360.0" y="148" fill="#8D6E63">先连上者拿走 1 分</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Still 10 VP 仍是 10 分</text>
    <text x="589.3" y="120" fill="#5D4037">Fewest wall: −1 VP</text>
    <text x="589.3" y="148" fill="#8D6E63">长城最少者 −1 分</text>
  </g>
</svg>
