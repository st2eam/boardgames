<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img">
<rect width="720" height="290" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">10 VP on your turn / 自己回合到 10 点</text>
<polygon points="90,55 77,71 103,71" fill="#C4952A" stroke="#5D4037"/><rect x="80" y="71" width="20" height="11" fill="#C4952A" stroke="#5D4037"/><text x="90" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">定居点 1</text><polygon points="170,48 154,64 186,64" fill="#5D4037" stroke="#5D4037"/><rect x="157" y="64" width="26" height="13" fill="#5D4037" stroke="#5D4037"/><text x="170" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">城市 2</text><rect x="250" y="50" width="90" height="50" rx="8" fill="#fff" stroke="#C4952A"/><text x="295" y="80" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">最长路 2</text><rect x="360" y="50" width="90" height="50" rx="8" fill="#fff" stroke="#5D4037"/><text x="405" y="80" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">最大军 2</text><g><rect x="480" y="45" width="56" height="70" rx="8" fill="#fff" stroke="#1565C0" stroke-width="1.6"/><text x="488" y="67" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1565C0">发展</text><rect x="488" y="101" width="40" height="7" rx="2" fill="#1565C0"/></g><text x="620" y="85" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#C4952A">10</text><text x="620" y="112" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">自己回合</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">定居点、城市、道路、军队、发展卡加起来，在自己回合先到 10 点获胜</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">First to 10 victory points on your turn wins</text>
