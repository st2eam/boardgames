<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
  <rect width="720" height="280" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Solo return claims Relics / 独自返回才能拿走遗迹</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <rect x="46" y="76" width="180" height="100" rx="12" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="136" y="103" text-anchor="middle" font-size="13" fill="#5D4037" font-weight="700">洞穴路径</text>
    <rect x="70" y="116" width="48" height="38" rx="6" fill="#F4E3B2" stroke="#C4952A" stroke-width="2"/><text x="94" y="141" text-anchor="middle" font-size="12" fill="#5D4037">遗迹 8</text>
    <circle cx="151" cy="135" r="11" fill="#C62828" stroke="#5D4037"/><circle cx="181" cy="135" r="11" fill="#C62828" stroke="#5D4037"/>
    <path d="M244 126 H320" stroke="#C4952A" stroke-width="3"/><path d="M308 114 L323 126 L308 138" fill="none" stroke="#C4952A" stroke-width="3"/>
    <rect x="338" y="76" width="150" height="100" rx="12" fill="#fff" stroke="#C4952A" stroke-width="3"/>
    <text x="413" y="106" text-anchor="middle" font-size="13" fill="#5D4037" font-weight="700">只有 1 人返回</text><text x="413" y="133" text-anchor="middle" font-size="12" fill="#8D6E63">拿遗迹 + 路上余宝</text><text x="413" y="157" text-anchor="middle" font-size="12" fill="#8D6E63">永久安全</text>
    <text x="574" y="97" text-anchor="middle" font-size="13" fill="#8D6E63">多人同时返回</text><text x="574" y="125" text-anchor="middle" font-size="12" fill="#5D4037">余宝平分</text><text x="574" y="150" text-anchor="middle" font-size="12" fill="#C62828">遗迹不拿</text>
  </g>
  <text x="360" y="238" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">遗迹不产生宝石；带回宝箱后，按牌面分值计入终局</text>
  <text x="360" y="258" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Relics score only at the end and cannot be lost once secured</text>
</svg>
