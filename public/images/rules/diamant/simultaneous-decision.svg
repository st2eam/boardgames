    <text x="360" y="68" text-anchor="middle" font-size="13" fill="#8D6E63">玩家 B</text>
    <rect x="322" y="82" width="76" height="92" rx="10" fill="#fff" stroke="#C4952A" stroke-width="3"/>
    <text x="360" y="120" text-anchor="middle" font-size="14" fill="#5D4037" font-weight="700">返回</text><text x="360" y="146" text-anchor="middle" font-size="12" fill="#8D6E63">Return</text>
