  </g>
  <path d="M110 186 V214 M360 186 V214 M610 186 V214" stroke="#C4952A" stroke-width="2"/>
  <path d="M110 214 H610" stroke="#C4952A" stroke-width="2"/>
  <path d="M360 214 V232" stroke="#C4952A" stroke-width="2"/>
  <text x="360" y="254" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">所有仍在洞穴的玩家同时亮牌，再结算返回者</text>
