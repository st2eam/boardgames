<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img">
<rect width="720" height="270" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Mud, rain, barn / 泥、雨、猪圈</text>
<ellipse cx="110" cy="90" rx="28" ry="16" fill="#6D4C41" stroke="#5D4037" stroke-width="1.4"/><circle cx="132" cy="86" r="8" fill="#6D4C41" stroke="#5D4037"/><circle cx="129" cy="84" r="1.6" fill="#5D4037"/><circle cx="135" cy="84" r="1.6" fill="#5D4037"/><text x="110" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">泥 → 弄脏</text><path d="M250 55 l8 30 l8-30" stroke="#1565C0" stroke-width="3" fill="none"/><path d="M270 55 l8 30 l8-30" stroke="#1565C0" stroke-width="3" fill="none"/><ellipse cx="280" cy="110" rx="28" ry="16" fill="#AD1457" stroke="#5D4037" stroke-width="1.4"/><circle cx="302" cy="106" r="8" fill="#AD1457" stroke="#5D4037"/><circle cx="299" cy="104" r="1.6" fill="#5D4037"/><circle cx="305" cy="104" r="1.6" fill="#5D4037"/><text x="280" y="145" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">雨冲干净猪</text><rect x="430" y="60" width="90" height="70" rx="8" fill="#EFEBE9" stroke="#5D4037"/><ellipse cx="475" cy="105" rx="28" ry="16" fill="#6D4C41" stroke="#5D4037" stroke-width="1.4"/><circle cx="497" cy="101" r="8" fill="#6D4C41" stroke="#5D4037"/><circle cx="494" cy="99" r="1.6" fill="#5D4037"/><circle cx="500" cy="99" r="1.6" fill="#5D4037"/><text x="475" y="155" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">猪圈挡雨</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">泥巴弄脏自己的猪；下雨冲洗没掩护的猪；猪圈挡住雨</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Mud dirties your pig; Rain washes unprotected pigs; Barns block rain</text>
