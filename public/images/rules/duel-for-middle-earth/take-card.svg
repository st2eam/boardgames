<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Take from the Row / 从牌列拿牌</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Available 可拿</text>
    <text x="130.7" y="120" fill="#5D4037">Card not partly covered</text>
    <text x="130.7" y="148" fill="#8D6E63">未被部分盖住的牌</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Play or discard 打出或弃掉</text>
    <text x="360.0" y="120" fill="#5D4037">Pay cost, or bin it</text>
    <text x="360.0" y="148" fill="#8D6E63">支付费用打出，或弃掉</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Or Landmark 或地标</text>
    <text x="589.3" y="120" fill="#5D4037">Pay, place a Fortress</text>
    <text x="589.3" y="148" fill="#8D6E63">付钱拿地标并放要塞</text>
  </g>
</svg>
