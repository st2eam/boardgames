<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">沙丘：帝国：每轮一图流</title><desc id="desc">从特工回合、揭示、冲突到轮末和终局的游戏流程。</desc><rect width="720" height="340" fill="#FAFAF5"/><g font-family="'PingFang SC','Microsoft YaHei',sans-serif" fill="#5D4037"><text x="360" y="30" text-anchor="middle" font-size="23" font-weight="700">沙丘：帝国｜每轮照着做</text><text x="360" y="55" text-anchor="middle" font-size="14">目标：先冲到 10 胜利点；完成这一轮后，总分最高获胜</text><g fill="#fff" stroke="#8D6E63" stroke-width="2"><rect x="25" y="83" width="205" height="105" rx="12"/><rect x="258" y="83" width="205" height="105" rx="12"/><rect x="490" y="83" width="205" height="105" rx="12"/><rect x="140" y="225" width="205" height="82" rx="12"/><rect x="375" y="225" width="205" height="82" rx="12"/></g><g text-anchor="middle"><text x="128" y="110" font-size="18" font-weight="700">1 · 特工回合</text><text x="128" y="135" font-size="14">轮流：打 1 张牌</text><text x="128" y="156" font-size="14">派 1 名特工 → 拿地点收益</text><text x="128" y="177" font-size="13">冲突地点：可投入部队</text><text x="360" y="110" font-size="18" font-weight="700">2 · 揭示回合</text><text x="360" y="135" font-size="14">派完自己的全部特工后</text><text x="360" y="156" font-size="14">揭示余下手牌 → 结算效果</text><text x="360" y="177" font-size="13">剑 = 增加本轮战力；可买 1 张牌</text><text x="592" y="110" font-size="18" font-weight="700">3 · 冲突</text><text x="592" y="135" font-size="14">部队 + 剑 + 效果 = 战力</text><text x="592" y="156" font-size="14">从高到低领取冲突奖励</text><text x="592" y="177" font-size="13">投入的部队回驻军</text><text x="242" y="252" font-size="18" font-weight="700">4 · 轮末</text><text x="242" y="276" font-size="14">制造者前进；到沙虫则收香料</text><text x="242" y="296" font-size="14">召回特工 → 弃牌 → 摸 5 张 → 传首家</text><text x="477" y="252" font-size="18" font-weight="700">5 · 检查终局</text><text x="477" y="276" font-size="14">有人到 10 分？完成本轮，再结算终局</text><text x="477" y="296" font-size="14">没人到 10 分？翻新冲突牌，开始下一轮</text></g></g><g stroke="#C4952A" stroke-width="4" fill="none"><path d="M234 136h18m-8-8 8 8-8 8M467 136h18m-8-8 8 8-8 8M592 192v22m-8-8 8 8 8-8M365 266h6m-8-8 8 8-8 8"/><path d="M477 312C690 332 720 227 700 198" stroke-dasharray="8 7"/></g><text x="654" y="325" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#C4952A">下一轮</text></svg>
