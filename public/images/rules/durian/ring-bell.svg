<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Durian bell check</title>
  <desc id="desc">Ring the bell, compare stock and orders, then give the anger chip to the last order-taker if orders exceed stock or to the bell-ringer if stock is enough.</desc>
  <rect width="720" height="280" fill="#FAFAF5"/>
  <text x="34" y="39" fill="#5D4037" font-family="Georgia,serif" font-size="24" font-weight="700">Ring, reveal, compare / 按铃、翻牌、比较</text>
  <g transform="translate(38 76)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle"><rect width="143" height="144" rx="14" fill="#fff" stroke="#D7C8B3" stroke-width="2"/><text x="72" y="29" fill="#5D4037" font-size="15" font-weight="700">RING / 按铃</text><path d="M45 94 Q72 48 99 94 Z" fill="#C4952A" stroke="#5D4037" stroke-width="2"/><rect x="39" y="94" width="66" height="12" rx="6" fill="#5D4037"/><circle cx="72" cy="116" r="7" fill="#5D4037"/><text x="72" y="133" fill="#8D6E63" font-size="13">stop now / 立刻停</text></g>
  <path d="M199 147 H248" stroke="#C4952A" stroke-width="5" stroke-linecap="round"/><path d="M237 136 L252 147 L237 158" fill="none" stroke="#C4952A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(270 76)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle"><rect width="170" height="144" rx="14" fill="#fff" stroke="#D7C8B3" stroke-width="2"/><text x="85" y="29" fill="#5D4037" font-size="15" font-weight="700">COMPARE / 比总数</text><text x="43" y="61" fill="#0B9C80" font-size="14" font-weight="700">stock</text><text x="43" y="79" fill="#0B9C80" font-size="14">库存</text><text x="127" y="61" fill="#EF6B73" font-size="14" font-weight="700">orders</text><text x="127" y="79" fill="#EF6B73" font-size="14">订单</text><text x="43" y="111" fill="#0B9C80" font-family="Georgia,serif" font-size="27" font-weight="700">7</text><text x="85" y="111" fill="#5D4037" font-size="24">vs</text><text x="127" y="111" fill="#EF6B73" font-family="Georgia,serif" font-size="27" font-weight="700">8</text><text x="85" y="132" fill="#8D6E63" font-size="12">gorillas first / 先算猩猩</text></g>
  <path d="M457 147 H504" stroke="#C4952A" stroke-width="5" stroke-linecap="round"/><path d="M493 136 L508 147 L493 158" fill="none" stroke="#C4952A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(528 76)" font-family="'PingFang SC','Microsoft YaHei',sans-serif"><rect width="156" height="144" rx="14" fill="#fff" stroke="#D7C8B3" stroke-width="2"/><text x="78" y="28" fill="#5D4037" font-size="15" font-weight="700" text-anchor="middle">ANGER / 挨骂</text><text x="16" y="62" fill="#B45309" font-size="15" font-weight="700">orders &gt; stock</text><text x="16" y="82" fill="#8D6E63" font-size="13">last order-taker</text><text x="16" y="109" fill="#0B9C80" font-size="15" font-weight="700">stock is enough</text><text x="16" y="129" fill="#8D6E63" font-size="13">bell-ringer</text></g>
  <text x="360" y="253" fill="#8D6E63" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" text-anchor="middle">Take the next anger chip, then deal fresh hidden inventory / 拿怒气后重新发隐藏库存牌</text>
</svg>
