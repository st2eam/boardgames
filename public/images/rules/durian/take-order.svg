<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Durian choose an order side</title>
  <desc id="desc">A drawn fruit card has two sides; the player selects one side to count as an order and ignores the other.</desc>
  <rect width="720" height="280" fill="#FAFAF5"/>
  <text x="34" y="39" fill="#5D4037" font-family="Georgia,serif" font-size="24" font-weight="700">Draw 1, choose 1 side / 摸 1 张，只选一边</text>
  <g transform="translate(53 78)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle"><rect width="130" height="145" rx="14" fill="#fff" stroke="#D7C8B3" stroke-width="2"/><text x="65" y="27" fill="#5D4037" font-size="15" font-weight="700">DRAW / 摸牌</text><rect x="34" y="45" width="62" height="76" rx="8" fill="#0B9C80" stroke="#5D4037" stroke-width="2"/><text x="65" y="91" fill="#fff" font-family="Georgia,serif" font-size="25" font-weight="700">?</text></g>
  <path d="M202 149 H262" stroke="#C4952A" stroke-width="5" stroke-linecap="round"/><path d="M250 138 L265 149 L250 160" fill="none" stroke="#C4952A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(284 68)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle"><rect width="152" height="164" rx="13" fill="#fff" stroke="#5D4037" stroke-width="2"/><text x="76" y="26" fill="#8D6E63" font-size="14">ONE CARD / 一张牌</text><rect x="19" y="42" width="114" height="45" rx="7" fill="#F2C94C"/><circle cx="48" cy="64" r="10" fill="#EF6B73"/><circle cx="75" cy="64" r="10" fill="#EF6B73"/><text x="108" y="70" fill="#5D4037" font-size="16" font-weight="700">2</text><rect x="19" y="93" width="114" height="45" rx="7" fill="#9B4DCA"/><circle cx="48" cy="115" r="10" fill="#7EC850"/><text x="80" y="121" fill="#fff" font-size="16" font-weight="700">1</text></g>
  <path d="M455 115 C492 87 523 94 549 117" fill="none" stroke="#C4952A" stroke-width="5" stroke-linecap="round"/><path d="M536 104 L553 118 L533 122" fill="none" stroke="#C4952A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M455 183 C492 210 523 202 549 180" fill="none" stroke="#8D6E63" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>
  <g transform="translate(568 78)" font-family="'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle"><rect width="108" height="145" rx="14" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="54" y="27" fill="#C4952A" font-size="15" font-weight="700">ORDER / 订单</text><text x="54" y="55" fill="#0B9C80" font-size="22" font-weight="700">✓</text><rect x="17" y="68" width="74" height="41" rx="7" fill="#F2C94C"/><circle cx="40" cy="88" r="9" fill="#EF6B73"/><circle cx="63" cy="88" r="9" fill="#EF6B73"/><text x="54" y="132" fill="#8D6E63" font-size="12">other side ignored</text></g>
</svg>
