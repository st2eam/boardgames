<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Communication Discs / 交流圆片</title><desc id="desc">Discs show intended Field spaces without revealing the cards in a player's hand.</desc>
  <rect width="720" height="260" rx="20" fill="#FAFAF5"/><style>text{font-family:Georgia,'PingFang SC','Microsoft YaHei',sans-serif;fill:#5D4037}.label{font-size:16px;font-weight:700}.note{font-size:13px;fill:#8D6E63}.card{fill:#fff;stroke:#D7CCC8;stroke-width:2}.slot{fill:#fff;stroke:#D7CCC8;stroke-width:2;stroke-dasharray:5 4}.disc{fill:#C4952A;stroke:#fff;stroke-width:3}</style>
  <text x="32" y="35" class="label">COMMUNICATION DISCS / 交流圆片</text><text x="32" y="57" class="note">Show intent, not card details / 表达意图，不泄露牌面</text>
  <g transform="translate(38 88)"><text y="18" class="label">FIELD / 场地</text><rect class="card" x="110" y="-14" width="68" height="70" rx="10"/><rect class="card" x="190" y="-14" width="68" height="70" rx="10"/><rect class="slot" x="270" y="-14" width="68" height="70" rx="10"/><rect class="slot" x="350" y="-14" width="68" height="70" rx="10"/><rect class="slot" x="430" y="-14" width="68" height="70" rx="10"/><circle class="disc" cx="304" cy="22" r="18"/><circle class="disc" cx="464" cy="22" r="18"/><text x="282" y="27" fill="#fff" style="font-family:Georgia,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;font-weight:700">YOU</text><text x="442" y="27" fill="#fff" style="font-family:Georgia,'PingFang SC','Microsoft YaHei',sans-serif;font-size:13px;font-weight:700">YOU</text></g>
  <path d="M392 168c0 22-48 22-48 0" fill="none" stroke="#C4952A" stroke-width="3"/><path d="m338 161 7 9 8-8" fill="none" stroke="#C4952A" stroke-width="3"/>
  <g transform="translate(70 190)"><text class="note">“I intend to play here.” / “我想在这里接牌。”</text><text y="27" class="note">Allowed: plans, public cards, Curses. / 可谈计划、公开牌、诅咒。</text><text y="49" class="note">Not allowed: hand colors or numbers. / 不可谈手牌颜色或数字。</text></g>
</svg>
