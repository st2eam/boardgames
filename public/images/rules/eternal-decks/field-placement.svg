<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Field placement / 场地接牌</title><desc id="desc">Mountain ascends, Cave descends, Camp follows common restrictions.</desc>
  <rect width="720" height="300" rx="20" fill="#FAFAF5"/><style>text{font-family:Georgia,'PingFang SC','Microsoft YaHei',sans-serif;fill:#5D4037}.label{font-size:16px;font-weight:700}.note{font-size:13px;fill:#8D6E63}.num{font-size:21px;font-weight:700}.card{fill:#fff;stroke:#D7CCC8;stroke-width:2}.move{fill:#fff8e1;stroke:#C4952A;stroke-width:3}</style>
  <text x="32" y="35" class="label">FIELD PLACEMENT / 场地接牌</text><text x="32" y="57" class="note">No adjacent same color or number / 相邻不能同色或同数字</text>
  <g transform="translate(32 82)"><text y="28" class="label">MOUNTAIN / 山脉 ↑</text><g transform="translate(170 0)"><rect class="card" width="62" height="58" rx="9"/><text x="24" y="36" class="num">2</text><rect class="card" x="72" width="62" height="58" rx="9"/><text x="96" y="36" class="num">5</text><rect class="move" x="144" width="62" height="58" rx="9"/><text x="168" y="36" class="num">8</text><path d="M220 29h75" stroke="#C4952A" stroke-width="3"/><path d="m288 21 10 8-10 8" fill="none" stroke="#C4952A" stroke-width="3"/><text x="315" y="34" class="note">low → high</text></g></g>
  <g transform="translate(32 154)"><text y="28" class="label">CAVE / 洞穴 ↓</text><g transform="translate(170 0)"><rect class="card" width="62" height="58" rx="9"/><text x="24" y="36" class="num">8</text><rect class="card" x="72" width="62" height="58" rx="9"/><text x="96" y="36" class="num">5</text><rect class="move" x="144" width="62" height="58" rx="9"/><text x="168" y="36" class="num">2</text><path d="M220 29h75" stroke="#C4952A" stroke-width="3"/><path d="m288 21 10 8-10 8" fill="none" stroke="#C4952A" stroke-width="3"/><text x="315" y="34" class="note">high → low</text></g></g>
  <g transform="translate(32 226)"><text y="28" class="label">CAMP / 营地</text><g transform="translate(170 0)"><rect class="card" width="62" height="58" rx="9"/><text x="24" y="36" class="num">4</text><rect class="card" x="72" width="62" height="58" rx="9"/><text x="96" y="36" class="num">7</text><rect class="move" x="144" width="62" height="58" rx="9"/><text x="168" y="36" class="num">3</text><text x="230" y="35" class="note">common restrictions only / 仅共同限制</text></g></g>
</svg>
