<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Revive an Eternal / 唤醒永恒者</title><desc id="desc">A final legal card fills a Field row, revives an Eternal, and adds its deck to the active player.</desc>
  <rect width="720" height="280" rx="20" fill="#FAFAF5"/><style>text{font-family:Georgia,'PingFang SC','Microsoft YaHei',sans-serif;fill:#5D4037}.label{font-size:16px;font-weight:700}.note{font-size:13px;fill:#8D6E63}.num{font-size:20px;font-weight:700}.card{fill:#fff;stroke:#D7CCC8;stroke-width:2}.gold{fill:#fff8e1;stroke:#C4952A;stroke-width:3}.eternal{fill:#5D4037}.white{fill:#fff;font-size:15px;font-weight:700}</style>
  <text x="32" y="35" class="label">REVIVE AN ETERNAL / 唤醒永恒者</text><text x="32" y="57" class="note">Fill a row → gain its 8-card deck → its Curse becomes active</text>
  <g transform="translate(34 91)"><text y="-10" class="note">1. Complete the row / 填满一行</text><rect class="card" x="0" y="0" width="62" height="74" rx="9"/><text x="24" y="44" class="num">2</text><rect class="card" x="72" y="0" width="62" height="74" rx="9"/><text x="96" y="44" class="num">5</text><rect class="gold" x="144" y="0" width="62" height="74" rx="9"/><text x="168" y="44" class="num">8</text><path d="M221 37h48" stroke="#C4952A" stroke-width="3"/><path d="m260 29 10 8-10 8" fill="none" stroke="#C4952A" stroke-width="3"/><rect class="eternal" x="280" y="-12" width="110" height="98" rx="14"/><text x="305" y="30" class="white">ETERNAL</text><text x="302" y="56" class="white">永恒者</text></g>
  <path d="M426 128h53" stroke="#C4952A" stroke-width="3"/><path d="m470 120 10 8-10 8" fill="none" stroke="#C4952A" stroke-width="3"/>
  <g transform="translate(504 80)"><text y="0" class="note">2. Your deck grows / 你的牌库增加</text><rect class="gold" x="0" y="16" width="120" height="44" rx="8"/><text x="28" y="44" class="label">+ 8 CARDS</text><text x="25" y="82" class="note">deck bottom / 牌库底部</text><circle cx="20" cy="118" r="17" fill="#C4952A"/><text x="12" y="124" class="white">!</text><text x="48" y="123" class="note">Curse active / 诅咒生效</text></g>
  <text x="34" y="245" class="note">A Jewel placed on the Eternal covers its Curse. / 把宝石交给永恒者即可盖住其诅咒。</text>
</svg>
