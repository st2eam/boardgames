<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Ko: cannot recapture immediately / 劫：不能马上提回来</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<circle cx="160" cy="110" r="18" fill="#5D4037"/><circle cx="220" cy="70" r="18" fill="#fff" stroke="#5D4037"/><circle cx="220" cy="150" r="18" fill="#fff" stroke="#5D4037"/><circle cx="280" cy="110" r="18" fill="#fff" stroke="#90A4AE" stroke-dasharray="4 3"/><text x="500" y="90" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">刚提掉的这点</text>
  <text x="500" y="108" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">The point just captured</text><text x="500" y="130" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">下一手不能立刻提回</text>
  <text x="500" y="148" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Cannot take it back this turn</text><text x="360" y="200" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">先在别处下一手，下下回合才能再提劫</text>
  <text x="360" y="218" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Play elsewhere first, recapture next turn</text></svg>
