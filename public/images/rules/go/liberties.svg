<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
  <rect width="720" height="280" fill="#FAFAF5"/>
  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Liberties are empty neighbors / 气是上下左右的空点</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<line x1="80" y1="50" x2="212" y2="50" stroke="#5D4037" stroke-width="1.5"/><line x1="80" y1="50" x2="80" y2="182" stroke="#5D4037" stroke-width="1.5"/><line x1="80" y1="94" x2="212" y2="94" stroke="#5D4037" stroke-width="1.5"/><line x1="124" y1="50" x2="124" y2="182" stroke="#5D4037" stroke-width="1.5"/><line x1="80" y1="138" x2="212" y2="138" stroke="#5D4037" stroke-width="1.5"/><line x1="168" y1="50" x2="168" y2="182" stroke="#5D4037" stroke-width="1.5"/><line x1="80" y1="182" x2="212" y2="182" stroke="#5D4037" stroke-width="1.5"/><line x1="212" y1="50" x2="212" y2="182" stroke="#5D4037" stroke-width="1.5"/><circle cx="124" cy="94" r="16" fill="#5D4037"/><circle cx="168" cy="94" r="16" fill="#5D4037"/><circle cx="80" cy="94" r="5" fill="#C4952A"/><circle cx="124" cy="50" r="5" fill="#C4952A"/><circle cx="124" cy="138" r="5" fill="#C4952A"/><circle cx="168" cy="50" r="5" fill="#C4952A"/><circle cx="168" cy="138" r="5" fill="#C4952A"/><circle cx="212" cy="94" r="5" fill="#C4952A"/><text x="480" y="90" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">这两子连成一组</text>
  <text x="480" y="108" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Two stones, one group</text><text x="480" y="140" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">金点 = 它们共享的气</text>
  <text x="480" y="158" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Gold dots = shared liberties</text><text x="360" y="240" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">气尽就会被提走</text>
  <text x="360" y="258" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">No liberties left → captured</text></svg>
