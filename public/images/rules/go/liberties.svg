<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Liberties / 气</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="102.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Empty neighbor 空邻交叉点</text>
    <text x="102.0" y="120" fill="#5D4037">Orthogonal only</text>
    <text x="102.0" y="148" fill="#8D6E63">只算上下左右</text>
    <rect x="196.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="274.0" y="82" fill="#5D4037" font-weight="700" font-size="15">A stone needs air 单子要有气</text>
    <text x="274.0" y="120" fill="#5D4037">Each empty point</text>
    <text x="274.0" y="148" fill="#8D6E63">每个空点一口气</text>
    <rect x="368.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="446.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Groups share 棋组共享气</text>
    <text x="446.0" y="120" fill="#5D4037">Connected same color</text>
    <text x="446.0" y="148" fill="#8D6E63">同色正交相连</text>
    <rect x="540.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="618.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Zero = dead 气尽则死</text>
    <text x="618.0" y="120" fill="#5D4037">Cannot stay</text>
    <text x="618.0" y="148" fill="#8D6E63">不能留在棋盘</text>
  </g>
</svg>
