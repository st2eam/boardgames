<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Build and Win / 建造与获胜</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Floor 楼层</text>
    <text x="130.7" y="120" fill="#5D4037">Two cards that sum to 9</text>
    <text x="130.7" y="148" fill="#8D6E63">两张牌合计正好 9</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Steal 偷楼</text>
    <text x="360.0" y="120" fill="#5D4037">Match opponent’s lone card</text>
    <text x="360.0" y="148" fill="#8D6E63">补对手顶层孤牌</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Win 获胜</text>
    <text x="589.3" y="120" fill="#5D4037">First to 5 floors</text>
    <text x="589.3" y="148" fill="#8D6E63">先建成 5 层者胜</text>
  </g>
</svg>
