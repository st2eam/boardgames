<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img">
<rect width="720" height="290" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Two cards summing to 9 / 两张相加 9 建成一层</text>
<g><rect x="80" y="50" width="56" height="80" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="88" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1565C0">4</text><rect x="88" y="116" width="40" height="7" rx="2" fill="#1565C0"/></g><g><rect x="150" y="50" width="56" height="80" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="158" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C62828">5</text><rect x="158" y="116" width="40" height="7" rx="2" fill="#C62828"/></g><text x="143" y="148" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">4+5=9 一层</text><rect x="360" y="140" width="120" height="16" rx="3" fill="#EFEBE9" stroke="#5D4037"/><rect x="360" y="122" width="120" height="16" rx="3" fill="#EFEBE9" stroke="#5D4037"/><rect x="360" y="104" width="120" height="16" rx="3" fill="#EFEBE9" stroke="#5D4037"/><rect x="360" y="86" width="120" height="16" rx="3" fill="#EFEBE9" stroke="#5D4037"/><rect x="360" y="68" width="120" height="16" rx="3" fill="#C4952A" stroke="#5D4037"/><text x="420" y="160" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">先建 5 层获胜</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">两张合计 9 的牌建成一层；先建成 5 层者立即获胜</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Two cards summing to 9 make a floor; first to five floors wins</text>
</svg>
