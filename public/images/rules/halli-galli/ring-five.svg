f">铃</text><text x="360" y="210" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">2 蕉 + 3 蕉 = 5，立刻按铃</text>
