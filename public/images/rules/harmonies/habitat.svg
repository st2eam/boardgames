<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img">
<rect width="720" height="270" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Place all three, then animals / 三块地形都放下</text>
<rect x="80" y="80" width="28" height="28" rx="3" fill="#2E7D32" stroke="#5D4037" stroke-width="1"/><rect x="120" y="80" width="28" height="28" rx="3" fill="#90A4AE" stroke="#5D4037" stroke-width="1"/><rect x="160" y="80" width="28" height="28" rx="3" fill="#1565C0" stroke="#5D4037" stroke-width="1"/><text x="134" y="130" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">三块都放到个人板</text><path d="M230 95 L290 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><rect x="310" y="55" width="120" height="90" rx="10" fill="#E8F5E9" stroke="#C4952A" stroke-width="2"/><rect x="330" y="80" width="18" height="18" rx="3" fill="#2E7D32" stroke="#5D4037" stroke-width="1"/><rect x="360" y="80" width="18" height="18" rx="3" fill="#90A4AE" stroke="#5D4037" stroke-width="1"/><rect x="390" y="80" width="18" height="18" rx="3" fill="#1565C0" stroke="#5D4037" stroke-width="1"/><circle cx="560" cy="95" r="22" fill="#C4952A" stroke="#5D4037"/><text x="560" y="135" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">匹配后放动物</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">三个地形必须全部放到个人板；图案对上栖息地才能放动物计分</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Place all three tokens on your board; match a habitat pattern to score animals</text>
</svg>
