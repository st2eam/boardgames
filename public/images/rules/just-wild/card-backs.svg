<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img">
<rect width="720" height="290" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Back halves sum to the front / 背面两半加起来是正面</text>
<g><rect x="80" y="50" width="70" height="100" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="88" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#2E7D32">8</text><rect x="88" y="136" width="54" height="7" rx="2" fill="#2E7D32"/></g><text x="115" y="168" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">正面 8</text><rect x="300" y="50" width="70" height="100" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><line x1="300" y1="100" x2="370" y2="100" stroke="#8D6E63" stroke-width="1.5"/><text x="335" y="85" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#1565C0">3</text><text x="335" y="130" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700" fill="#C62828">5</text><text x="335" y="168" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">3 + 5 = 8</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">背面上下两个数字相加，等于这张牌正面的点数</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">The two back numbers sum to the front value</text>
</svg>
