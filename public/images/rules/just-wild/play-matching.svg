<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img">
  <rect width="720" height="250" fill="#FAFAF5"/>
  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Halves must add up / 两半加起来等于你出的牌</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<rect x="80" y="50" width="100" height="120" rx="10" fill="#fff" stroke="#5D4037"/><text x="130" y="90" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#C62828">3</text><line x1="90" y1="110" x2="170" y2="110" stroke="#5D4037"/><text x="130" y="145" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#1565C0">5</text><g><rect x="280" y="60" width="70" height="100" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="288" y="82" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C4952A">8</text><rect x="288" y="146" width="54" height="7" rx="2" fill="#C4952A"/></g><text x="360" y="200" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">场上 3+5=8，所以 8 可以盖上去</text>
  <text x="360" y="218" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">3+5=8, so an 8 can cover</text></svg>
