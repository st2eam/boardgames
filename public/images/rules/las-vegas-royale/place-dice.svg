<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Place One Face / 放同一点数</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Roll 掷骰</text>
    <text x="130.7" y="120" fill="#5D4037">All remaining dice</text>
    <text x="130.7" y="148" fill="#8D6E63">掷出全部剩余骰子</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Choose 选择</text>
    <text x="360.0" y="120" fill="#5D4037">Exactly one number</text>
    <text x="360.0" y="148" fill="#8D6E63">只选一个点数</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Place all 全放</text>
    <text x="589.3" y="120" fill="#5D4037">Every die of that face</text>
    <text x="589.3" y="148" fill="#8D6E63">该点数的骰子全部放入</text>
  </g>
</svg>
