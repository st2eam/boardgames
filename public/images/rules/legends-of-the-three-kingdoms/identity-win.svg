<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Identities and victory / 身份与获胜</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="102.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Monarch 主公</text>
    <text x="102.0" y="120" fill="#5D4037">Kill rebels + traitor</text>
    <text x="102.0" y="148" fill="#8D6E63">消灭反贼与内奸</text>
    <rect x="196.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="274.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Loyalist 忠臣</text>
    <text x="274.0" y="120" fill="#5D4037">Protect the monarch</text>
    <text x="274.0" y="148" fill="#8D6E63">辅佐主公获胜</text>
    <rect x="368.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="446.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Rebel 反贼</text>
    <text x="446.0" y="120" fill="#5D4037">Kill the monarch</text>
    <text x="446.0" y="148" fill="#8D6E63">击杀主公即可</text>
    <rect x="540.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="618.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Traitor 内奸</text>
    <text x="618.0" y="120" fill="#5D4037">Last one standing</text>
    <text x="618.0" y="148" fill="#8D6E63">主公最后被消灭</text>
  </g>
</svg>
