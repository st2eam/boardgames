  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Play 杀, they may 闪 / 出杀，对方可闪</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<circle cx="140" cy="110" r="40" fill="#FFECB3" stroke="#C4952A" stroke-width="3"/><text x="140" y="116" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5D4037">你</text><g><rect x="200" y="70" width="52" height="74" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="208" y="92" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C62828">杀</text><rect x="208" y="130" width="36" height="7" rx="2" fill="#C62828"/></g><path d="M270 110 L360 110" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="430" cy="110" r="40" fill="#E3F2FD" stroke="#1565C0" stroke-width="2"/><text x="430" y="116" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5D4037">目标</text><g><rect x="500" y="70" width="52" height="74" rx="8" fill="#fff" stroke="#1565C0" stroke-width="1.6"/><text x="508" y="92" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1565C0">闪</text><rect x="508" y="130" width="36" height="7" rx="2" fill="#1565C0"/></g><text x="360" y="200" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">对攻击范围内出杀；对方打出闪则无效</text>
  <text x="360" y="218" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Play Sha at someone in range; Shan cancels it</text></svg>
