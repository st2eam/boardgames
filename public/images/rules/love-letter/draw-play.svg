<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
  <rect width="720" height="260" fill="#FAFAF5"/>
  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Draw 1, play 1 / 抽 1 张，打出 1 张</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<rect x="40" y="70" width="60" height="86" rx="8" fill="#EFEBE9" stroke="#5D4037" stroke-width="1.4"/><rect x="48" y="80" width="44" height="66" rx="4" fill="#D7CCC8"/><text x="70" y="175" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">牌库</text><path d="M110 110 L170 110" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><g><rect x="180" y="70" width="52" height="74" rx="8" fill="#fff" stroke="#5D4037" stroke-width="1.6"/><text x="188" y="92" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#5D4037">1</text><rect x="188" y="130" width="36" height="7" rx="2" fill="#5D4037"/></g><text x="206" y="175" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5D4037">守卫</text><g><rect x="280" y="60" width="60" height="86" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="288" y="82" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C4952A">2</text><rect x="288" y="132" width="44" height="7" rx="2" fill="#C4952A"/></g><text x="310" y="175" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#C4952A">神父（打出）</text><path d="M350 100 L430 100" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><g><rect x="450" y="70" width="52" height="74" rx="8" fill="#fff" stroke="#C4952A" stroke-width="1.6"/><text x="458" y="92" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C4952A">2</text><rect x="458" y="130" width="36" height="7" rx="2" fill="#C4952A"/></g><text x="476" y="175" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">弃牌</text><text x="360" y="215"