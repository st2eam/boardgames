<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Round ends / 一轮结束</text>
<g><rect x="80" y="55" width="50" height="72" rx="8" fill="#EFEBE9" stroke="#5D4037" stroke-width="1.4"/><rect x="88" y="65" width="34" height="52" rx="4" fill="#EFEBE9"/></g><text x="105" y="145" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">牌库抽空</text><text x="220" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5D4037">或</text><g><rect x="300" y="55" width="56" height="80" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="308" y="77" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C4952A">8</text><rect x="308" y="121" width="40" height="7" rx="2" fill="#C4952A"/></g><g><rect x="380" y="65" width="56" height="80" rx="8" fill="#EFEBE9" stroke="#5D4037" stroke-width="1.4"/><rect x="388" y="75" width="40" height="60" rx="4" fill="#D7CCC8"/></g><g><rect x="410" y="75" width="56" height="80" rx="8" fill="#EFEBE9" stroke="#5D4037" stroke-width="1.4"/><rect x="418" y="85" width="40" height="60" rx="4" fill="#D7CCC8"/></g><text x="380" y="160" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">只剩一人还在</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">牌库抽完，或只剩一名玩家没出局，本轮立即比牌结束</text>
