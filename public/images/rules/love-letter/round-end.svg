<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Round ends when / 一轮何时结束</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="328.0" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="188.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Deck empty 牌堆抽空</text>
    <text x="188.0" y="120" fill="#5D4037">Highest hand wins</text>
    <text x="188.0" y="148" fill="#8D6E63">手牌点数最高胜</text>
    <rect x="368.0" y="48" width="328.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="532.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Last standing 只剩一人</text>
    <text x="532.0" y="120" fill="#5D4037">That player wins</text>
    <text x="532.0" y="148" fill="#8D6E63">该玩家直接获胜</text>
  </g>
</svg>
