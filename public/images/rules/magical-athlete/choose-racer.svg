<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Magical Athlete racer selection</title><desc id="desc">Players secretly choose one unused racer, reveal together, and place the tokens at Start.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#C4952A"/></marker></defs><rect width="720" height="260" rx="18" fill="#FAFAF5"/>
  <text x="360" y="34" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#5D4037">Choose one unused racer for this race</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#fff" stroke="#5D4037" stroke-width="2"><rect x="58" y="76" width="130" height="110" rx="12"/><rect x="295" y="76" width="130" height="110" rx="12"/><rect x="532" y="76" width="130" height="110" rx="12"/></g><text x="123" y="111" font-size="16" font-weight="700" fill="#5D4037">Secret hand</text><text x="123" y="148" font-size="30">? ? ? ?</text><path d="M205 131L278 131" stroke="#C4952A" stroke-width="4" marker-end="url(#a)"/><text x="360" y="110" font-size="16" font-weight="700" fill="#5D4037">Reveal together</text><text x="360" y="151" font-size="28">🐘</text><path d="M443 131L515 131" stroke="#C4952A" stroke-width="4" marker-end="url(#a)"/><text x="597" y="110" font-size="16" font-weight="700" fill="#5D4037">Start space</text><circle cx="597" cy="148" r="25" fill="#C4952A"/><text x="597" y="154" font-size="14" fill="#fff">START</text></g>
  <text x="360" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5D4037">Each racer races only once, so save a useful power for a later track if you dare.</text>
</svg>
