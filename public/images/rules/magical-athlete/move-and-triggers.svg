<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Magical Athlete main move and trigger priority</title><desc id="desc">A main move completes, then simultaneous triggers resolve current player, other players clockwise, and track effects.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#C4952A"/></marker></defs><rect width="720" height="260" rx="18" fill="#FAFAF5"/>
  <text x="360" y="33" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#5D4037">Finish the main move, then resolve triggers</text>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="48" y="78" width="133" height="94" rx="12" fill="#fff" stroke="#5D4037" stroke-width="2"/><text x="114" y="109" font-size="16" font-weight="700" fill="#5D4037">Roll and move</text><text x="114" y="143" font-size="28">🎲 → 4</text><path d="M197 125L265 125" stroke="#C4952A" stroke-width="4" marker-end="url(#a)"/><rect x="280" y="78" width="130" height="94" rx="12" fill="#fff" stroke="#5D4037" stroke-width="2"/><text x="345" y="109" font-size="16" font-weight="700" fill="#5D4037">Current racer</text><text x="345" y="143" font-size="14" fill="#8D6E63">trigger 1</text><path d="M426 125L486 125" stroke="#C4952A" stroke-width="4" marker-end="url(#a)"/><rect x="501" y="78" width="171" height="94" rx="12" fill="#fff" stroke="#5D4037" stroke-width="2"/><text x="586" y="105" font-size="15" font-weight="700" fill="#5D4037">Others clockwise</text><text x="586" y="130" font-size="14" fill="#8D6E63">then track space</text><text x="586" y="151" font-size="16">★  →  TRIP</text></g>
  <text x="360" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#5D4037">Only effects marked “can” are optional; tripped racers still finish this move before skipping their next main move.</text>
</svg>
