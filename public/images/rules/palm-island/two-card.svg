<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
  <rect width="720" height="260" fill="#FAFAF5"/>
  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Use the top two cards / 只用最上面两张</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<rect x="80" y="50" width="130" height="150" rx="10" fill="#fff" stroke="#5D4037" stroke-width="1.5" transform="rotate(-8 145 125)"/><rect x="160" y="45" width="130" height="150" rx="10" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="225" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">顶牌</text><rect x="200" y="120" width="16" height="16" rx="3" fill="#2E7D32" stroke="#5D4037" stroke-width="1"/><rect x="224" y="120" width="16" height="16" rx="3" fill="#1565C0" stroke="#5D4037" stroke-width="1"/><text x="225" y="165" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5D4037">当资源花掉</text><text x="500" y="120" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">或丢掉顶牌，露出下一张</text>
  <text x="500" y="138" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Or discard the top card</text><text x="360" y="220" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">每回合只对露出的两张行动，再把岛牌转走</text>
  <text x="360" y="238" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Act on the two visible cards, then rotate the island</text></svg>
