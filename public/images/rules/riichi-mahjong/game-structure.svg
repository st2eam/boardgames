<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">East wind, then maybe South / 先打东场，再打南场</text>
<rect x="80" y="50" width="90" height="60" rx="10" fill="#fff" stroke="#C4952A" stroke-width="2"/><text x="125" y="86" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" fill="#C4952A">東</text><rect x="200" y="50" width="90" height="60" rx="10" fill="#fff" stroke="#5D4037" stroke-width="2"/><text x="245" y="86" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" fill="#5D4037">南</text><rect x="80" y="130" width="90" height="60" rx="10" fill="#fff" stroke="#8D6E63" stroke-width="2"/><text x="125" y="166" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" fill="#8D6E63">西</text><rect x="200" y="130" width="90" height="60" rx="10" fill="#fff" stroke="#8D6E63" stroke-width="2"/><text x="245" y="166" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="18" fill="#8D6E63">北</text><text x="140" y="210" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">东风战：东1–东4</text><path d="M320 110 L400 110" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><rect x="420" y="55" width="220" height="120" rx="12" fill="#fff" stroke="#C4952A" stroke-width="2"/><text x="530" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">东南战再加南1–南4</text><text x="530" y="124" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">桌上风向转一圈</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">东风战打完东四局；东南战再打南场四局</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">East-only is four east hands; hanchan adds a south round</text>
