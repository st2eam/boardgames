<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Jokers / 百搭牌</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Wild 百搭</text>
    <text x="130.7" y="120" fill="#5D4037">Stands in for any tile</text>
    <text x="130.7" y="148" fill="#8D6E63">可代替任意一张</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Value 分值</text>
    <text x="360.0" y="120" fill="#5D4037">Counts as the tile it is</text>
    <text x="360.0" y="148" fill="#8D6E63">按所代表的牌计分</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Retrieve 取回</text>
    <text x="589.3" y="120" fill="#5D4037">Replace it later if legal</text>
    <text x="589.3" y="148" fill="#8D6E63">之后可用真牌换回</text>
  </g>
</svg>
