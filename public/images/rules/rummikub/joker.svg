<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img">
<rect width="720" height="290" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Joker stands in / 百搭代替那张</text>
<g><rect x="80" y="50" width="56" height="80" rx="8" fill="#fff" stroke="#1565C0" stroke-width="1.6"/><text x="88" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1565C0">5</text><rect x="88" y="116" width="40" height="7" rx="2" fill="#1565C0"/></g><g><rect x="150" y="50" width="62" height="80" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="158" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C4952A">J</text><rect x="158" y="116" width="46" height="7" rx="2" fill="#C4952A"/></g><g><rect x="222" y="50" width="56" height="80" rx="8" fill="#fff" stroke="#1565C0" stroke-width="1.6"/><text x="230" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#1565C0">7</text><rect x="230" y="116" width="40" height="7" rx="2" fill="#1565C0"/></g><text x="176" y="148" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">J 当 6</text><text x="500" y="90" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">计分按它所代表的那张</text><text x="500" y="112" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">这里按 6 分算</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">百搭可代替任意牌；计分按它当前代表的那张点数</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">A joker stands in for any tile and counts as that tile’s value</text>
</svg>
