<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">SCOUT round end and scoring</title>
  <desc id="desc">A round ends on an empty hand or after everyone else scouts, then captured cards and chips gain points while hand cards lose points.</desc>
  <rect width="720" height="280" fill="#FAFAF5"/>
  <text x="35" y="39" fill="#5D4037" font-family="Georgia,serif" font-size="24" font-weight="700">Round end / 一轮结束</text>
  <g transform="translate(28 67)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="190" height="150" rx="14" fill="#fff" stroke="#D7C8B3" stroke-width="2"/>
    <text x="95" y="30" fill="#5D4037" font-size="16" font-weight="700" text-anchor="middle">EMPTY HAND / 手牌清空</text>
    <g transform="translate(58 48)" fill="#fff" stroke="#C4952A" stroke-width="3"><rect width="34" height="58" rx="6"/><rect x="38" width="34" height="58" rx="6"/></g>
    <path d="M48 78 H90" stroke="#C4952A" stroke-width="4" stroke-linecap="round"/><path d="M81 68 L93 78 L81 88" fill="none" stroke="#C4952A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="131" fill="#8D6E63" font-size="13" text-anchor="middle">Show the last card / 打出最后一张</text>
  </g>
  <text x="236" y="147" fill="#8D6E63" font-family="Georgia,serif" font-size="22" font-weight="700">OR / 或</text>
  <g transform="translate(273 67)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="245" height="150" rx="14" fill="#fff" stroke="#D7C8B3" stroke-width="2"/>
    <text x="122" y="28" fill="#5D4037" font-size="16" font-weight="700" text-anchor="middle">EVERYONE SCOUTS</text>
    <text x="122" y="49" fill="#5D4037" font-size="15" font-weight="700" text-anchor="middle">其他所有人都 Scout</text>
    <g fill="#8D6E63" font-size="14" text-anchor="middle"><text x="122" y="76">active set stays / 无人压过</text></g>
    <path d="M61 105 C91 82 155 82 185 105" fill="none" stroke="#C4952A" stroke-width="4" stroke-linecap="round"/><path d="M173 93 L189 106 L170 109" fill="none" stroke="#C4952A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="122" y="134" fill="#8D6E63" font-size="12" text-anchor="middle">all others take one end card / 从端点各拿一张</text>
  </g>
  <g transform="translate(537 67)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="155" height="150" rx="14" fill="#fff" stroke="#D7C8B3" stroke-width="2"/>
    <text x="77" y="30" fill="#5D4037" font-size="17" font-weight="700" text-anchor="middle">SCORE / 计分</text>
    <text x="16" y="65" fill="#C4952A" font-family="Georgia,serif" font-size="22" font-weight="700">+1</text><text x="52" y="65" fill="#8D6E63" font-size="13">captured / 收集</text>
    <text x="16" y="94" fill="#C4952A" font-family="Georgia,serif" font-size="22" font-weight="700">+1</text><text x="52" y="94" fill="#8D6E63" font-size="13">chip / 指示物</text>
    <text x="16" y="123" fill="#B45309" font-family="Georgia,serif" font-size="22" font-weight="700">−1</text><text x="52" y="123" fill="#8D6E63" font-size="13">hand card / 手牌</text>
  </g>
</svg>
