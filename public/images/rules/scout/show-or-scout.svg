<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">SCOUT Show or Scout action</title>
  <desc id="desc">A stronger run captures the active set, while the alternate action removes one end card and inserts it into a hand.</desc>
  <rect width="720" height="320" fill="#FAFAF5"/>
  <text x="34" y="38" fill="#5D4037" font-family="Georgia,serif" font-size="24" font-weight="700">Show or Scout / 出牌或星探</text>
  <g transform="translate(34 64)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="304" height="204" rx="16" fill="#fff" stroke="#D7C8B3" stroke-width="2"/>
    <text x="18" y="30" fill="#8D6E63" font-size="15">ACTIVE SET / 桌面组合</text>
    <g transform="translate(43 53)" fill="#F8EFD9" stroke="#5D4037" stroke-width="2"><rect width="52" height="74" rx="8"/><rect x="57" width="52" height="74" rx="8"/><rect x="114" width="52" height="74" rx="8"/></g>
    <g fill="#5D4037" font-family="Georgia,serif" font-size="26" font-weight="700" text-anchor="middle"><text x="69" y="101">3</text><text x="126" y="101">4</text><text x="183" y="101">5</text></g>
    <text x="18" y="159" fill="#8D6E63" font-size="15">YOUR ADJACENT RUN / 相邻顺子</text>
    <g transform="translate(43 170)" fill="#fff" stroke="#C4952A" stroke-width="4"><rect width="52" height="74" rx="8"/><rect x="57" width="52" height="74" rx="8"/><rect x="114" width="52" height="74" rx="8"/><rect x="171" width="52" height="74" rx="8"/></g>
    <g fill="#C4952A" font-family="Georgia,serif" font-size="26" font-weight="700" text-anchor="middle"><text x="69" y="218">6</text><text x="126" y="218">7</text><text x="183" y="218">8</text><text x="240" y="218">9</text></g>
  </g>
  <path d="M354 129 H402" stroke="#C4952A" stroke-width="5" stroke-linecap="round"/><path d="M390 118 L405 129 L390 140" fill="none" stroke="#C4952A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="381" y="106" fill="#C4952A" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" text-anchor="middle">SHOW / 压过</text>
  <g transform="translate(422 64)" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
    <rect width="264" height="204" rx="16" fill="#fff" stroke="#D7C8B3" stroke-width="2"/>
    <text x="17" y="30" fill="#8D6E63" font-size="15">SCOUT / 从端点拿牌</text>
    <g transform="translate(34 48)" fill="#F8EFD9" stroke="#5D4037" stroke-width="2"><rect width="46" height="66" rx="8"/><rect x="50" width="46" height="66" rx="8"/><rect x="100" width="46" height="66" rx="8"/></g>
    <g fill="#5D4037" font-family="Georgia,serif" font-size="23" font-weight="700" text-anchor="middle"><text x="57" y="88">3</text><text x="107" y="88">4</text><text x="157" y="88">5</text></g>
    <path d="M58 125 C58 148 110 146 120 162" fill="none" stroke="#C4952A" stroke-width="4" stroke-linecap="round"/><path d="M111 151 L121 164 L105 163" fill="none" stroke="#C4952A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(36 169)" fill="#fff" stroke="#5D4037" stroke-width="2"><rect width="40" height="55" rx="7"/><rect x="44" width="40" height="55" rx="7"/><rect x="88" width="40" height="55" rx="7"/><rect x="132" width="40" height="55" rx="7"/></g>
    <g fill="#5D4037" font-family="Georgia,serif" font-size="20" font-weight="700" text-anchor="middle"><text x="56" y="204">7</text><text x="100" y="204">3</text><text x="144" y="204">7</text><text x="188" y="204">8</text></g>
    <text x="210" y="211" fill="#C4952A" font-size="13">insert / 插入</text>
  </g>
</svg>
