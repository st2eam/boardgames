<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Take a card / 拿一张牌</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Draw 2, keep 1 抽 2 留 1</text>
    <text x="130.7" y="120" fill="#5D4037">Other to a discard</text>
    <text x="130.7" y="148" fill="#8D6E63">另一张放到弃牌</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Or take discard 或拿弃牌</text>
    <text x="360.0" y="120" fill="#5D4037">Top of one pile</text>
    <text x="360.0" y="148" fill="#8D6E63">只能拿某堆顶</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Then play Duos 然后出双人组</text>
    <text x="589.3" y="120" fill="#5D4037">Optional effects</text>
    <text x="589.3" y="148" fill="#8D6E63">可选触发效果</text>
  </g>
</svg>
