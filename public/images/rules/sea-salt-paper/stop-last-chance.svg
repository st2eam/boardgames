<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">7+ points: end it / 满 7 分可结束</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">STOP 停</text>
    <text x="130.7" y="120" fill="#5D4037">Score now, all full</text>
    <text x="130.7" y="148" fill="#8D6E63">立刻结束，全员完整计分</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">LAST CHANCE 最后机会</text>
    <text x="360.0" y="120" fill="#5D4037">Others +1 turn</text>
    <text x="360.0" y="148" fill="#8D6E63">其他人再各 1 回合</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Caller lead? 发起者最高？</text>
    <text x="589.3" y="120" fill="#5D4037">Bonus or only color</text>
    <text x="589.3" y="148" fill="#8D6E63">领先拿奖励，否则只计颜色</text>
  </g>
</svg>
