<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
<rect width="720" height="280" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Spend ≤2 tokens on a Scan / 扫描最多花 2 个信号</text>
<rect x="40" y="50" width="280" height="110" rx="12" fill="#fff" stroke="#5D4037"/><g><rect x="55" y="65" width="48" height="70" rx="8" fill="#fff" stroke="#5D4037" stroke-width="1.6"/><text x="63" y="87" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#5D4037">A</text><rect x="63" y="121" width="32" height="7" rx="2" fill="#5D4037"/></g><g><rect x="110" y="65" width="48" height="70" rx="8" fill="#fff" stroke="#5D4037" stroke-width="1.6"/><text x="118" y="87" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#5D4037">B</text><rect x="118" y="121" width="32" height="7" rx="2" fill="#5D4037"/></g><g><rect x="165" y="65" width="48" height="70" rx="8" fill="#fff" stroke="#90A4AE" stroke-width="1.6"/><text x="173" y="87" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#90A4AE">C</text><rect x="173" y="121" width="32" height="7" rx="2" fill="#90A4AE"/></g><g><rect x="220" y="65" width="48" height="70" rx="8" fill="#fff" stroke="#90A4AE" stroke-width="1.6"/><text x="228" y="87" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#90A4AE">D</text><rect x="228" y="121" width="32" height="7" rx="2" fill="#90A4AE"/></g><text x="180" y="175" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">扫描：弃牌行</text><rect x="360" y="80" width="22" height="22" rx="3" fill="#C4952A" stroke="#5D4037" stroke-width="1"/><rect x="390" y="80" width="22" height="22" rx="3" fill="#C4952A" stroke="#5D4037" stroke-width="1"/><text x="386" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">最多 2 枚</text><path d="M430 90 L490 90" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><polygon points="540,60 620,90 540,120" fill="#fff" stroke="#C4952A" stroke-width="2"/><text x="575" y="145" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">标记对应扇区</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">扫描时最多用两个信号，每枚再弃一行牌并在该扇区做标记</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">During Scan spend at most two tokens to discard extra row cards and mark that sector</text>
