<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Rotate solar system / 每次逆时针 1 扇区</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="36" y="52" width="200" height="140" rx="14" fill="#fff" stroke="#C4952A"/>
    <circle cx="136" cy="100" r="28" fill="#FFF8E1" stroke="#C4952A" stroke-width="3"/>
    <text x="136" y="104" fill="#5D4037" font-weight="700">1</text>
    <text x="136" y="152" fill="#5D4037">1st: top disc</text>
    <text x="136" y="172" fill="#8D6E63">第 1 次：只转顶层</text>
    <rect x="260" y="52" width="200" height="140" rx="14" fill="#fff" stroke="#C4952A"/>
    <circle cx="360" cy="100" r="36" fill="none" stroke="#BCAAA4" stroke-width="3"/>
    <circle cx="360" cy="100" r="22" fill="#FFF8E1" stroke="#C4952A" stroke-width="3"/>
    <text x="360" y="104" fill="#5D4037" font-weight="700">2</text>
    <text x="360" y="152" fill="#5D4037">2nd: middle (+ top)</text>
    <text x="360" y="172" fill="#8D6E63">第 2 次：中层带着顶层</text>
    <rect x="484" y="52" width="200" height="140" rx="14" fill="#fff" stroke="#C4952A"/>
    <circle cx="584" cy="100" r="42" fill="none" stroke="#BCAAA4" stroke-width="3"/>
    <circle cx="584" cy="100" r="30" fill="none" stroke="#A1887F" stroke-width="3"/>
    <circle cx="584" cy="100" r="18" fill="#FFF8E1" stroke="#C4952A" stroke-width="3"/>
    <text x="584" y="104" fill="#5D4037" font-weight="700">3</text>
    <text x="584" y="152" fill="#5D4037">3rd: bottom (all)</text>
    <text x="584" y="172" fill="#8D6E63">第 3 次：三层一起转</text>
  </g>
  <text x="360" y="220" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Research or first pass each round / 研发或每轮首位过牌时旋转</text>
</svg>
