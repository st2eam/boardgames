<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img">
  <rect width="720" height="280" fill="#FAFAF5"/>
  <text x="180" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Scan a sector / 扫描扇区</text>
  <text x="540" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Computer / 电脑</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12">
    <rect x="24" y="44" width="312" height="212" rx="14" fill="#fff" stroke="#C4952A"/>
    <text x="40" y="70" fill="#8D6E63">Data slot 数据槽</text>
    <rect x="40" y="84" width="48" height="36" rx="6" fill="#FFF8E1" stroke="#C4952A"/>
    <text x="64" y="106" text-anchor="middle" fill="#5D4037">data</text>
    <rect x="96" y="84" width="48" height="36" rx="6" fill="#EFEBE9" stroke="#5D4037"/>
    <text x="120" y="106" text-anchor="middle" fill="#C4952A">you</text>
    <rect x="152" y="84" width="48" height="36" rx="6" fill="#FFF8E1" stroke="#C4952A"/>
    <text x="176" y="106" text-anchor="middle" fill="#5D4037">data</text>
    <rect x="208" y="84" width="48" height="36" rx="6" fill="#EFEBE9" stroke="#90A4AE"/>
    <text x="232" y="106" text-anchor="middle" fill="#607D8B">opp</text>
    <text x="180" y="148" text-anchor="middle" fill="#5D4037">第 2 格立刻 2 分</text>
    <text x="180" y="172" text-anchor="middle" fill="#5D4037">标记时拿走最左数据</text>
    <text x="180" y="196" text-anchor="middle" fill="#8D6E63">后放者优先平手</text>
    <text x="180" y="220" text-anchor="middle" fill="#8D6E63">胜者拿恒星 · 参与者各 1 声望</text>
    <rect x="384" y="44" width="312" height="212" rx="14" fill="#fff" stroke="#5D4037"/>
    <text x="400" y="70" fill="#8D6E63">Pool max 6 · 数据池最多 6</text>
    <text x="400" y="94" fill="#5D4037">Top row must be full · 分析需顶行满</text>
    <rect x="400" y="108" width="44" height="28" rx="4" fill="#C4952A"/>
    <rect x="450" y="108" width="44" height="28" rx="4" fill="#C4952A"/>
    <rect x="500" y="108" width="44" height="28" rx="4" fill="#EFEBE9" stroke="#5D4037"/>
    <rect x="550" y="108" width="44" height="28" rx="4" fill="#EFEBE9" stroke="#5D4037"/>
    <text x="400" y="164" fill="#5D4037">Computer tech adds a column</text>
    <rect x="400" y="176" width="44" height="28" rx="4" fill="#FFF8E1" stroke="#C4952A"/>
    <rect x="450" y="176" width="44" height="28" rx="4" fill="#FAFAF5" stroke="#BCAAA4" stroke-dasharray="4 3"/>
    <text x="540" y="196" fill="#8D6E63">2 VP / 上格 2 分</text>
    <text x="540" y="232" text-anchor="middle" fill="#8D6E63">分析清空电脑全部数据（池留下）</text>
  </g>
</svg>
