<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img">
  <rect width="720" height="300" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">SETI turn / 你的回合</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="40" y="50" width="200" height="72" rx="12" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="140" y="80" fill="#5D4037" font-weight="700">1 main action</text>
    <text x="140" y="100" fill="#8D6E63">1 次主行动</text>
    <rect x="260" y="50" width="200" height="72" rx="12" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="360" y="80" fill="#5D4037" font-weight="700">+ free actions</text>
    <text x="360" y="100" fill="#8D6E63">可穿插自由行动</text>
    <rect x="480" y="50" width="200" height="72" rx="12" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="580" y="80" fill="#5D4037" font-weight="700">Turn ends</text>
    <text x="580" y="100" fill="#8D6E63">然后结算回合结束</text>
    <rect x="120" y="160" width="220" height="72" rx="12" fill="#fff" stroke="#8D6E63"/>
    <text x="230" y="190" fill="#5D4037" font-weight="700">Gold / neutral milestones</text>
    <text x="230" y="210" fill="#8D6E63">金色 25/50/70 · 中立 20/30</text>
    <rect x="380" y="160" width="220" height="72" rx="12" fill="#fff" stroke="#8D6E63"/>
    <text x="490" y="190" fill="#5D4037" font-weight="700">Discover species</text>
    <text x="490" y="210" fill="#8D6E63">若触发则发现种族</text>
  </g>
  <path d="M240 86h20" stroke="#C4952A" stroke-width="2"/>
  <path d="M460 86h20" stroke="#C4952A" stroke-width="2"/>
  <path d="M580 122v20H230v18" fill="none" stroke="#C4952A" stroke-width="2"/>
  <path d="M340 196h40" stroke="#C4952A" stroke-width="2"/>
  <text x="360" y="268" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Then next player clockwise · skip anyone who already passed / 然后顺时针下家 · 已过牌者跳过</text>
</svg>
