<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Trading Posts / 商站</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">After noble 贵族之后</text>
    <text x="130.7" y="120" fill="#5D4037">Place a coat of arms</text>
    <text x="130.7" y="148" fill="#8D6E63">满足后放纹章</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Keep power 持续能力</text>
    <text x="360.0" y="120" fill="#5D4037">Until the game ends</text>
    <text x="360.0" y="148" fill="#8D6E63">能力保留到终局</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Examples 示例</text>
    <text x="589.3" y="120" fill="#5D4037">Gold = 2 gems; +prestige</text>
    <text x="589.3" y="148" fill="#8D6E63">金当 2 宝石；加声望</text>
  </g>
</svg>
