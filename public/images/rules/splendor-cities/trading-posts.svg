<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img">
<rect width="720" height="290" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Coat of arms after a noble / 贵族来访后放纹章</text>
<rect x="70" y="50" width="90" height="90" rx="12" fill="#fff" stroke="#5D4037"/><text x="115" y="95" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5D4037">贵族</text><path d="M180 95 L240 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><polygon points="280,70 300,85 295,110 265,110 260,85" fill="#C4952A" stroke="#5D4037"/><text x="280" y="135" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">纹章</text><path d="M330 95 L390 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><rect x="410" y="55" width="220" height="80" rx="12" fill="#fff" stroke="#C4952A" stroke-width="2"/><text x="520" y="90" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5D4037">商站能力</text><text x="520" y="112" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">持续到终局</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">贵族来访后放置纹章，对应商站能力一直留到终局</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">After a noble visit, place a coat of arms to keep a trade power</text>
