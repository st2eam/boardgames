<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
<rect width="720" height="260" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Evolve at end of turn / 回合结束才进化</text>
<g><rect x="70" y="50" width="70" height="90" rx="8" fill="#fff" stroke="#C62828" stroke-width="1.6"/><text x="78" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C62828">喷火</text><rect x="78" y="126" width="54" height="7" rx="2" fill="#C62828"/></g><rect x="88" y="100" width="14" height="14" rx="3" fill="#C62828" stroke="#5D4037" stroke-width="1"/><rect x="108" y="100" width="14" height="14" rx="3" fill="#C62828" stroke="#5D4037" stroke-width="1"/><text x="105" y="158" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">永久奖励够了</text><path d="M170 95 L230 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><g><rect x="250" y="45" width="76" height="100" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="258" y="67" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C4952A">超喷</text><rect x="258" y="131" width="60" height="7" rx="2" fill="#C4952A"/></g><text x="288" y="162" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">进化</text><path d="M350 95 L410 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><g><rect x="430" y="55" width="70" height="90" rx="8" fill="#EFEBE9" stroke="#5D4037" stroke-width="1.4"/><rect x="438" y="65" width="54" height="70" rx="4" fill="#D7CCC8"/></g><text x="465" y="162" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">旧卡垫到训练家下</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">回合结束才能用永久奖励进化；旧宝可梦垫到训练家板下</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">End of turn: evolve with bonuses only; old Pokémon goes under the Trainer tile</text>
</svg>
