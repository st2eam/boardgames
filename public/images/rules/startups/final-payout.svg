<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Startups final majority payout</title>
  <desc id="desc">Minority investors pay three-value Capital for each share to the sole company majority holder, while a tie pays no one.</desc>
  <rect width="720" height="280" fill="#FAFAF5"/>
  <text x="35" y="39" fill="#5D4037" font-family="Georgia,serif" font-size="24" font-weight="700">Final payout / 最终分红</text>
  <g transform="translate(36 70)" font-family="'PingFang SC','Microsoft YaHei',sans-serif"><rect width="395" height="164" rx="14" fill="#fff" stroke="#D7C8B3" stroke-width="2"/><text x="198" y="29" fill="#5D4037" font-size="16" font-weight="700" text-anchor="middle">ONE SOLE LEADER / 唯一最大股东</text><g transform="translate(30 47)" fill="#F7D6DF" stroke="#5D4037" stroke-width="2"><rect width="36" height="56" rx="6"/><rect x="40" width="36" height="56" rx="6"/><rect x="80" width="36" height="56" rx="6"/></g><text x="88" y="129" fill="#C4952A" font-size="14" font-weight="700" text-anchor="middle">3 shares / 3 股</text><g transform="translate(248 55)" fill="#fff" stroke="#5D4037" stroke-width="2"><rect width="36" height="56" rx="6"/></g><text x="267" y="129" fill="#8D6E63" font-size="14" text-anchor="middle">1 share / 1 股</text><path d="M239 83 H147" stroke="#C4952A" stroke-width="5" stroke-linecap="round"/><path d="M158 72 L143 83 L158 94" fill="none" stroke="#C4952A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="191" cy="83" r="17" fill="#C4952A" stroke="#8D6E63"/><text x="191" y="89" fill="#fff" font-family="Georgia,serif" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="198" y="154" fill="#8D6E63" font-size="13" text-anchor="middle">minority pays 3 per share / 小股东每股付 3</text></g>
  <text x="458" y="151" fill="#8D6E63" font-family="Georgia,serif" font-size="22" font-weight="700">OR / 或</text>
  <g transform="translate(496 70)" font-family="'PingFang SC','Microsoft YaHei',sans-serif"><rect width="184" height="164" rx="14" fill="#fff" stroke="#D7C8B3" stroke-width="2"/><text x="92" y="30" fill="#5D4037" font-size="16" font-weight="700" text-anchor="middle">TIED LEAD / 并列第一</text><g transform="translate(28 52)" fill="#F7D6DF" stroke="#5D4037" stroke-width="2"><rect width="36" height="56" rx="6"/><rect x="40" width="36" height="56" rx="6"/><rect x="93" width="36" height="56" rx="6"/><rect x="133" width="36" height="56" rx="6"/></g><text x="92" y="139" fill="#B45309" font-size="16" font-weight="700" text-anchor="middle">no payout / 无人分红</text></g>
</svg>
