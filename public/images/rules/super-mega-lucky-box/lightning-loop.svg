<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d"><title id="t">Lightning changes a number / 闪电调整数字</title><desc id="d">One token moves one number step; 9 wraps to 1 and 1 wraps to 9 / 一个标记移动一步；9循环到1，1循环到9</desc><rect width="720" height="280" rx="20" fill="#FAFAF5"/><text x="360" y="39" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-weight="bold" fill="#5D4037">One Lightning = one step / 一个闪电 = 移动一步</text><g fill="#fff" stroke="#8D6E63" stroke-width="2"><circle cx="205" cy="130" r="38"/><circle cx="360" cy="130" r="38"/><circle cx="515" cy="130" r="38"/></g><g font-family="Arial,sans-serif" font-size="31" font-weight="bold" text-anchor="middle" fill="#5D4037"><text x="205" y="141">9</text><text x="360" y="141">1</text><text x="515" y="141">2</text></g><path d="M248 130H309" stroke="#C4952A" stroke-width="4"/><path d="M309 122l14 8-14 8z" fill="#C4952A"/><path d="M403 130H464" stroke="#C4952A" stroke-width="4"/><path d="M464 122l14 8-14 8z" fill="#C4952A"/><g font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#5D4037"><text x="278" y="107">⚡</text><text x="433" y="107">⚡</text></g><text x="360" y="203" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#5D4037">9 + 1 step → 1  ·  1 − 1 step → 9</text><text x="360" y="237" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#8D6E63">Spend more tokens to move more steps / 多花标记可移动更多步</text></svg>
