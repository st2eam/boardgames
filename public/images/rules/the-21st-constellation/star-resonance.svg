<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Star Resonance / 星之共鸣</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="102.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Pair 对子</text>
    <text x="102.0" y="120" fill="#5D4037">Same value → 1 spell</text>
    <text x="102.0" y="148" fill="#8D6E63">同点数抽1术卡</text>
    <rect x="196.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="274.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Sequence 顺子</text>
    <text x="274.0" y="120" fill="#5D4037">Rising values → 1</text>
    <text x="274.0" y="148" fill="#8D6E63">连增抽1术卡</text>
    <rect x="368.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="446.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Suited seq. 同花顺</text>
    <text x="446.0" y="120" fill="#5D4037">Same suit extra 1</text>
    <text x="446.0" y="148" fill="#8D6E63">多人局再多抽1</text>
    <rect x="540.0" y="48" width="156.0" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="618.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Once per slot 每格一次</text>
    <text x="618.0" y="120" fill="#5D4037">Max 5 star slots</text>
    <text x="618.0" y="148" fill="#8D6E63">最多五个星位</text>
  </g>
</svg>
