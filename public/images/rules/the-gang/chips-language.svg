<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
<rect width="720" height="260" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Chips are the only talk / 筹码就是语言</text>
<text x="90" y="90" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="22" fill="#C62828">✕</text><text x="90" y="120" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">不能说话</text><circle cx="280" cy="95" r="18" fill="#C62828" stroke="#5D4037" stroke-width="1.4"/><circle cx="280" cy="95" r="13" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="320" cy="95" r="18" fill="#C4952A" stroke="#5D4037" stroke-width="1.4"/><circle cx="320" cy="95" r="13" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="360" cy="95" r="18" fill="#1565C0" stroke="#5D4037" stroke-width="1.4"/><circle cx="360" cy="95" r="13" fill="none" stroke="#fff" stroke-width="1.5"/><text x="320" y="130" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">推筹码 = 表态</text><circle cx="520" cy="80" r="16" fill="#C62828" stroke="#5D4037" stroke-width="1.4"/><circle cx="520" cy="80" r="11" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="548" cy="90" r="16" fill="#C62828" stroke="#5D4037" stroke-width="1.4"/><circle cx="548" cy="90" r="11" fill="none" stroke="#fff" stroke-width="1.5"/><circle cx="576" cy="100" r="16" fill="#C62828" stroke="#5D4037" stroke-width="1.4"/><circle cx="576" cy="100" r="11" fill="none" stroke="#fff" stroke-width="1.5"/><text x="548" y="135" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">红筹顺序必须真</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">不能暗示；桌上只能用筹码交流；红色筹码的顺序必须说真话</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">No hints; chips are the language; red order must be true</text>
</svg>
