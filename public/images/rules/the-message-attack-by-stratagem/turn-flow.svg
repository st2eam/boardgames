<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img">
  <rect width="720" height="250" fill="#FAFAF5"/>
  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Transmit or intercept / 传出或截获</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<g><rect x="60" y="50" width="64" height="90" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="68" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#C62828">情</text><rect x="68" y="126" width="48" height="7" rx="2" fill="#C62828"/></g><path d="M140 95 L220 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><rect x="230" y="55" width="160" height="80" rx="10" fill="#FFF8E1" stroke="#C4952A"/><text x="310" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" fill="#5D4037">情报通道</text><path d="M400 95 L480 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><circle cx="540" cy="95" r="36" fill="#E3F2FD" stroke="#1565C0"/><text x="540" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#5D4037">下家</text><text x="360" y="180" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">传出的牌沿通道走；有人可截获</text>
  <text x="360" y="198" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">The card travels; someone may intercept</text><text x="360" y="205" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037"></text></svg>
