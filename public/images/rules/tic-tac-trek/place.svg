<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img">
<rect width="720" height="260" fill="#FAFAF5"/>
  <text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Three in a line become a trek / 三个符号连成线就走线</text>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<rect x="80" y="40" width="60" height="48" rx="6" fill="#fff" stroke="#5D4037"/><rect x="150" y="40" width="60" height="48" rx="6" fill="#fff" stroke="#5D4037"/><rect x="220" y="40" width="60" height="48" rx="6" fill="#fff" stroke="#5D4037"/><rect x="80" y="95" width="60" height="48" rx="6" fill="#fff" stroke="#5D4037"/><text x="110" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#C4952A">▲</text><rect x="150" y="95" width="60" height="48" rx="6" fill="#fff" stroke="#5D4037"/><text x="180" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#C4952A">▲</text><rect x="220" y="95" width="60" height="48" rx="6" fill="#fff" stroke="#5D4037"/><text x="250" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" fill="#C4952A">▲</text><rect x="80" y="150" width="60" height="48" rx="6" fill="#fff" stroke="#5D4037"/><rect x="150" y="150" width="60" height="48" rx="6" fill="#fff" stroke="#5D4037"/><rect x="220" y="150" width="60" height="48" rx="6" fill="#fff" stroke="#5D4037"/><text x="500" y="90" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">横着三个 ▲</text>
  <text x="500" y="108" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Three ▲ in a row</text><text x="500" y="120" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">放上篝火开始计分</text>
  <text x="500" y="138" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Place a campfire and score</text><text x="360" y="215" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">连成线的那一趟按旁边空位计分</text>
  <text x="360" y="233" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">The trek scores empty spaces beside the line</text></svg>
