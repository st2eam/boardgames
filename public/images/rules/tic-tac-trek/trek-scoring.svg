<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Treks and Campfires / 路线与篝火</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Trek 路线</text>
    <text x="130.7" y="120" fill="#5D4037">3 of your symbols in a line</text>
    <text x="130.7" y="148" fill="#8D6E63">己方符号连成 3 个</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Campfire 篝火</text>
    <text x="360.0" y="120" fill="#5D4037">On the tile you just placed</text>
    <text x="360.0" y="148" fill="#8D6E63">放在刚放下的那块上</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Score 计分</text>
    <text x="589.3" y="120" fill="#5D4037">1 VP per empty neighbor</text>
    <text x="589.3" y="148" fill="#8D6E63">周围每空位 1 分</text>
  </g>
</svg>
