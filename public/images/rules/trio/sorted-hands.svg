    <rect x="24.0" y="52" width="214.7" height="84" rx="12" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="131.3" y="88" fill="#5D4037" font-weight="700">Sort low → high</text>
    <text x="131.3" y="110" fill="#8D6E63">从低到高排好</text>
