  <text x="360" y="203" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Stack 2+2+4 — next player draws 8</text></svg>
