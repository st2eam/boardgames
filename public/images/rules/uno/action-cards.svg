<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Action cards / 功能牌</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Skip 跳过</text>
    <text x="130.7" y="120" fill="#5D4037">Next loses turn</text>
    <text x="130.7" y="148" fill="#8D6E63">下家失去回合</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Reverse 反转</text>
    <text x="360.0" y="120" fill="#5D4037">Flip direction</text>
    <text x="360.0" y="148" fill="#8D6E63">改变出牌方向</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Draw Two 抽两张</text>
    <text x="589.3" y="120" fill="#5D4037">Next draws 2, skip</text>
    <text x="589.3" y="148" fill="#8D6E63">下家抽 2 并跳过</text>
  </g>
</svg>
