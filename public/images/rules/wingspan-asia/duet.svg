<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Duet Mode (1–2) / 二重奏（1–2 人）</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Map 地图</text>
    <text x="130.7" y="120" fill="#5D4037">Place a token when you play</text>
    <text x="130.7" y="148" fill="#8D6E63">打出鸟时在地图放标记</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Match 匹配</text>
    <text x="360.0" y="120" fill="#5D4037">Habitat + a trait</text>
    <text x="360.0" y="148" fill="#8D6E63">栖息地 + 一项特征</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Score 计分</text>
    <text x="589.3" y="120" fill="#5D4037">Connected groups of tokens</text>
    <text x="589.3" y="148" fill="#8D6E63">相连的标记组计分</text>
  </g>
</svg>
