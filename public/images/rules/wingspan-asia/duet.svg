<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Play a bird, place a map token / 出鸟后在地图放标记</text>
<g><rect x="80" y="50" width="70" height="90" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="88" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#2E7D32">鸟</text><rect x="88" y="126" width="54" height="7" rx="2" fill="#2E7D32"/></g><text x="115" y="158" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">打出鸟牌</text><path d="M180 95 L240 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><rect x="260" y="50" width="160" height="100" rx="10" fill="#BBDEFB" stroke="#5D4037"/><rect x="300" y="85" width="18" height="18" rx="3" fill="#C4952A" stroke="#5D4037" stroke-width="1"/><rect x="340" y="100" width="18" height="18" rx="3" fill="#C4952A" stroke="#5D4037" stroke-width="1"/><text x="340" y="168" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">匹配栖息地与特征</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">二重奏：打出鸟牌后，在地图上放置匹配栖息地与特征的标记</text>
