<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img">
<rect width="720" height="290" fill="#FAFAF5"/>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#C4952A"/></marker></defs>
<text x="360" y="26" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#5D4037" font-weight="700">Teal after last turn, before goal / 青绿在目标之前</text>
<rect x="90" y="80" width="22" height="22" rx="3" fill="#00897B" stroke="#5D4037" stroke-width="1"/><g><rect x="140" y="50" width="64" height="90" rx="8" fill="#fff" stroke="#C4952A" stroke-width="3"/><text x="148" y="72" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700" fill="#00897B">鸟</text><rect x="148" y="126" width="48" height="7" rx="2" fill="#00897B"/></g><text x="155" y="158" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">最后行动之后</text><path d="M230 95 L300 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><rect x="320" y="60" width="140" height="70" rx="10" fill="#B2DFDB" stroke="#00897B" stroke-width="2"/><text x="390" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">青绿能力</text><path d="M480 95 L540 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><rect x="550" y="60" width="120" height="70" rx="10" fill="#fff" stroke="#5D4037"/><text x="610" y="100" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">再结算目标</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">青绿能力在回合最后一次行动之后、结算目标之前触发</text>
<text x="360" y="266" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">Teal powers resolve after the last turn of the round, before the goal</text>
</svg>
