<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img">
  <rect width="720" height="240" fill="#FAFAF5"/>
  <text x="360" y="28" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5D4037" font-weight="700">Nectar / 花蜜</text>
  <g font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" text-anchor="middle">
    <rect x="24.0" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#C4952A" stroke-width="1.5"/>
    <text x="130.7" y="82" fill="#5D4037" font-weight="700" font-size="15">Wild food 万能食物</text>
    <text x="130.7" y="120" fill="#5D4037">Pays any food cost</text>
    <text x="130.7" y="148" fill="#8D6E63">可支付任意食物费用</text>
    <rect x="253.3" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="360.0" y="82" fill="#5D4037" font-weight="700" font-size="15">Spent pile 已花费格</text>
    <text x="360.0" y="120" fill="#5D4037">Park it on that habitat</text>
    <text x="360.0" y="148" fill="#8D6E63">放在打出鸟的栖息地</text>
    <rect x="482.7" y="48" width="213.3" height="172" rx="14" fill="#fff" stroke="#5D4037" stroke-width="1.5"/>
    <text x="589.3" y="82" fill="#5D4037" font-weight="700" font-size="15">Score 计分</text>
    <text x="589.3" y="120" fill="#5D4037">Most nectar per habitat</text>
    <text x="589.3" y="148" fill="#8D6E63">各栖息地花蜜最多者得分</text>
  </g>
</svg>
