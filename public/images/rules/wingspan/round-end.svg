<rect x="50" y="55" width="120" height="90" rx="10" fill="#fff" stroke="#C4952A" stroke-width="2"/><text x="110" y="95" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">回合目标</text><text x="110" y="118" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">+分</text><rect x="230" y="80" width="20" height="20" rx="3" fill="#5D4037" stroke="#5D4037" stroke-width="1"/><rect x="256" y="80" width="20" height="20" rx="3" fill="#5D4037" stroke="#5D4037" stroke-width="1"/><rect x="282" y="80" width="20" height="20" rx="3" fill="#5D4037" stroke="#5D4037" stroke-width="1"/><text x="266" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">收回行动方块</text><circle cx="480" cy="95" r="20" fill="#C4952A" stroke="#5D4037" stroke-width="1.4"/><circle cx="480" cy="95" r="15" fill="none" stroke="#fff" stroke-width="1.5"/><path d="M520 95 L580 95" stroke="#C4952A" stroke-width="2.5" marker-end="url(#arr)"/><text x="560" y="125" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8D6E63">起始玩家传下去</text><text x="360" y="248" text-anchor="middle" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" fill="#5D4037">先结算回合目标，收回行动方块，再把起始玩家标记传给下家</text>
